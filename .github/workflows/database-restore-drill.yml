name: Database Restore Drill

on:
  workflow_dispatch:
    inputs:
      backup_object_key:
        description: 'R2 object key under habitta-database-backups-prod (for example daily/2026/08/12/<id>.tar.gz.enc)'
        required: true
        type: string

permissions:
  contents: read

env:
  BACKUP_BUCKET: habitta-database-backups-prod

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify restore prerequisites
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in BACKUP_ENCRYPTION_PASSPHRASE CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "Missing required production secret: $name" >&2; exit 1; }
          done

      - name: Download encrypted backup and checksum
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_OBJECT_KEY: ${{ inputs.backup_object_key }}
        run: |
          set -euo pipefail
          case "$BACKUP_OBJECT_KEY" in
            daily/*.tar.gz.enc) ;;
            *) echo 'backup_object_key must be a daily/*.tar.gz.enc object' >&2; exit 1 ;;
          esac
          umask 077
          mkdir -p .restore/encrypted .restore/plain
          BASENAME="$(basename "$BACKUP_OBJECT_KEY")"
          CHECKSUM_KEY="${BACKUP_OBJECT_KEY%.tar.gz.enc}.sha256"
          ENCRYPTED_FILE="$GITHUB_WORKSPACE/.restore/encrypted/$BASENAME"
          CHECKSUM_FILE="$GITHUB_WORKSPACE/.restore/encrypted/${BASENAME%.tar.gz.enc}.sha256"
          pnpm --filter @habitta/api exec wrangler r2 object get \
            "$BACKUP_BUCKET/$BACKUP_OBJECT_KEY" \
            --file "$ENCRYPTED_FILE" --remote
          pnpm --filter @habitta/api exec wrangler r2 object get \
            "$BACKUP_BUCKET/$CHECKSUM_KEY" \
            --file "$CHECKSUM_FILE" --remote
          test -s "$ENCRYPTED_FILE"
          test -s "$CHECKSUM_FILE"
          EXPECTED_SHA256="$(awk 'NR == 1 { print $1 }' "$CHECKSUM_FILE")"
          ACTUAL_SHA256="$(sha256sum "$ENCRYPTED_FILE" | awk '{ print $1 }')"
          test -n "$EXPECTED_SHA256"
          test "$EXPECTED_SHA256" = "$ACTUAL_SHA256"
          printf 'Encrypted backup checksum verified: %s\n' "$ACTUAL_SHA256"

      - name: Decrypt and validate internal manifest
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          BACKUP_OBJECT_KEY: ${{ inputs.backup_object_key }}
        run: |
          set -euo pipefail
          BASENAME="$(basename "$BACKUP_OBJECT_KEY")"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE \
            -in "$GITHUB_WORKSPACE/.restore/encrypted/$BASENAME" \
            -out "$GITHUB_WORKSPACE/.restore/plain/database-backup.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/.restore/plain/extracted"
          tar -C "$GITHUB_WORKSPACE/.restore/plain/extracted" -xzf "$GITHUB_WORKSPACE/.restore/plain/database-backup.tar.gz"
          cd "$GITHUB_WORKSPACE/.restore/plain/extracted"
          sha256sum --check manifest.sha256
          test -s schema.sql
          test -s data.sql
          test -s roles.sql

      - name: Start isolated local Supabase database
        run: |
          set -euo pipefail
          supabase db start

      - name: Restore schema and data into isolated database
        run: |
          set -euo pipefail
          ADMIN_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          RESTORE_URL='postgresql://postgres:postgres@127.0.0.1:54322/habitta_restore_drill'
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS habitta_restore_drill;'
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE habitta_restore_drill;'
          psql "$RESTORE_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/.restore/plain/extracted/schema.sql"
          psql "$RESTORE_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/.restore/plain/extracted/data.sql"

      - name: Verify restored database
        run: |
          set -euo pipefail
          RESTORE_URL='postgresql://postgres:postgres@127.0.0.1:54322/habitta_restore_drill'
          TABLE_COUNT="$(psql "$RESTORE_URL" -Atqc "select count(*) from pg_tables where schemaname = 'public';")"
          MIGRATION_TABLE_PRESENT="$(psql "$RESTORE_URL" -Atqc "select count(*) from information_schema.tables where table_schema = 'supabase_migrations' and table_name = 'schema_migrations';")"
          test "$TABLE_COUNT" -gt 0
          printf 'Restored public tables: %s\n' "$TABLE_COUNT"
          printf 'Migration metadata tables present: %s\n' "$MIGRATION_TABLE_PRESENT"
          psql "$RESTORE_URL" -v ON_ERROR_STOP=1 -c 'select current_database(), now();'

      - name: Remove restored plaintext and local database
        if: always()
        run: |
          rm -rf .restore
          supabase stop --no-backup || true
