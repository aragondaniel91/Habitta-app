name: Database Restore Drill

on:
  workflow_dispatch:
    inputs:
      backup_object_key:
        description: 'R2 object key under habitta-database-backups-prod (for example daily/2026/08/12/<id>.tar.gz.enc)'
        required: true
        type: string

permissions:
  contents: read

env:
  BACKUP_BUCKET: habitta-database-backups-prod

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.114.0
          github-token: ${{ github.token }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify restore prerequisites
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in BACKUP_ENCRYPTION_PASSPHRASE CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "Missing required production secret: $name" >&2; exit 1; }
          done
      - name: Download encrypted backup and checksum
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_OBJECT_KEY: ${{ inputs.backup_object_key }}
        run: |
          set -euo pipefail
          case "$BACKUP_OBJECT_KEY" in
            daily/*.tar.gz.enc) ;;
            *) echo 'backup_object_key must be a daily/*.tar.gz.enc object' >&2; exit 1 ;;
          esac
          umask 077
          mkdir -p .restore/encrypted .restore/plain
          BASENAME="$(basename "$BACKUP_OBJECT_KEY")"
          CHECKSUM_KEY="${BACKUP_OBJECT_KEY%.tar.gz.enc}.sha256"
          ENCRYPTED_FILE="$GITHUB_WORKSPACE/.restore/encrypted/$BASENAME"
          CHECKSUM_FILE="$GITHUB_WORKSPACE/.restore/encrypted/${BASENAME%.tar.gz.enc}.sha256"
          pnpm --filter @habitta/api exec wrangler r2 object get "$BACKUP_BUCKET/$BACKUP_OBJECT_KEY" --file "$ENCRYPTED_FILE" --remote
          pnpm --filter @habitta/api exec wrangler r2 object get "$BACKUP_BUCKET/$CHECKSUM_KEY" --file "$CHECKSUM_FILE" --remote
          test -s "$ENCRYPTED_FILE"
          test -s "$CHECKSUM_FILE"
          EXPECTED_SHA256="$(awk 'NR == 1 { print $1 }' "$CHECKSUM_FILE")"
          ACTUAL_SHA256="$(sha256sum "$ENCRYPTED_FILE" | awk '{ print $1 }')"
          test -n "$EXPECTED_SHA256"
          test "$EXPECTED_SHA256" = "$ACTUAL_SHA256"
          printf 'Encrypted backup checksum verified: %s\n' "$ACTUAL_SHA256"
      - name: Decrypt and validate internal manifest
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          BACKUP_OBJECT_KEY: ${{ inputs.backup_object_key }}
        run: |
          set -euo pipefail
          BASENAME="$(basename "$BACKUP_OBJECT_KEY")"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -pass env:BACKUP_ENCRYPTION_PASSPHRASE -in "$GITHUB_WORKSPACE/.restore/encrypted/$BASENAME" -out "$GITHUB_WORKSPACE/.restore/plain/database-backup.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/.restore/plain/extracted"
          tar -C "$GITHUB_WORKSPACE/.restore/plain/extracted" -xzf "$GITHUB_WORKSPACE/.restore/plain/database-backup.tar.gz"
          cd "$GITHUB_WORKSPACE/.restore/plain/extracted"
          sha256sum --check manifest.sha256
          test -s schema.sql
          test -s data.sql
          test -s roles.sql
          test -s auth-data.sql
          test -s source-metrics.tsv
          for metric in auth_users payments payment_allocations payment_receipts receivable_items receivable_ledger_entries; do
            VALUE="$(awk -F '\t' -v metric="$metric" '$1 == metric { print $2 }' source-metrics.tsv)"
            [[ "$VALUE" =~ ^[0-9]+$ ]] || { echo "Invalid aggregate metric: $metric" >&2; exit 1; }
          done
      - name: Start isolated local Supabase database
        run: |
          set -euo pipefail
          supabase db start
      - name: Prepare clean restore target
        run: |
          set -euo pipefail
          RESTORE_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          # Preserve Supabase-managed Auth DDL and schema_migrations, but remove all Auth data.
          # The target is a disposable local database used only by this drill.
          psql "$RESTORE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            tables text;
          begin
            select string_agg(format('%I.%I', schemaname, tablename), ', ' order by tablename)
              into tables
              from pg_tables
             where schemaname = 'auth'
               and tablename <> 'schema_migrations';
            if tables is not null then
              execute 'truncate table ' || tables || ' cascade';
            end if;
          end
          $$;

          drop schema if exists public cascade;
          create schema public authorization postgres;
          grant usage on schema public to postgres, anon, authenticated, service_role;
          SQL

          # HAB-417: clear every schema the backup will recreate, not just `public`.
          #
          # `supabase db start` applies the repository's migrations, so the target already holds
          # whatever schemas those migrations create. Dropping only `public` left
          # `habitta_internal` in place; the dump's `CREATE TABLE IF NOT EXISTS` then silently
          # skipped an existing table and the `ALTER TABLE ... ADD CONSTRAINT ... PRIMARY KEY`
          # that follows failed with "multiple primary keys are not allowed". The drill had been
          # proving that `public` restores, and nothing else.
          #
          # The list comes from the dump rather than from a name written here, so a migration that
          # introduces the next schema does not quietly reintroduce this blind spot.
          EXTRACTED="$GITHUB_WORKSPACE/.restore/plain/extracted"
          BACKUP_SCHEMAS="$(grep -oE '^CREATE SCHEMA (IF NOT EXISTS )?"[^"]+"' "$EXTRACTED/schema.sql" \
            | grep -oE '"[^"]+"$' | tr -d '"' | sort -u)"

          for schema in $BACKUP_SCHEMAS; do
            # A backup must never be able to talk this drill into dropping a Supabase-managed
            # schema. If one is ever named, stop rather than obey.
            case "$schema" in
              public|auth|storage|vault|extensions|graphql|graphql_public|realtime|_realtime|net|supabase_functions|supabase_migrations|pg_*|information_schema)
                echo "Refusing to drop managed schema named by the backup: $schema" >&2
                exit 1
                ;;
            esac
            psql "$RESTORE_URL" -v ON_ERROR_STOP=1 \
              -c "drop schema if exists \"$schema\" cascade;"
            printf 'Dropped schema carried by the backup: %s\n' "$schema"
          done

          # Emptiness is asserted over every schema the restore touches, for the same reason: a
          # check that only counts `public` is how the previous blind spot stayed invisible.
          REMAINING="$(psql "$RESTORE_URL" -Atqc "select count(*) from pg_tables where schemaname = 'public'$(for s in $BACKUP_SCHEMAS; do printf " or schemaname = '%s'" "$s"; done);")"
          EXISTING_AUTH_USERS="$(psql "$RESTORE_URL" -Atqc 'select count(*) from auth.users;')"
          test "$REMAINING" -eq 0
          test "$EXISTING_AUTH_USERS" -eq 0
          printf 'Clean isolated restore target prepared.\n'
      - name: Restore Auth, schema and application data
        run: |
          set -euo pipefail
          RESTORE_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          EXTRACTED="$GITHUB_WORKSPACE/.restore/plain/extracted"
          # roles.sql is checksum-validated backup evidence. Local Supabase owns platform roles.
          # Disabling replication triggers only for the import keeps dump ordering portable; the
          # next step performs explicit post-restore referential and financial invariant checks.
          #
          # HAB-417: data.sql is loaded on its own, and auth-data.sql is not loaded at all.
          #
          # The backup step's comment asserts that "the standard Supabase dump intentionally
          # excludes managed schemas such as auth". The CLI does not behave that way: data.sql
          # carries 22 `COPY "auth"` blocks, exactly the same 22 tables auth-data.sql contains.
          # Loading both therefore inserted every Auth row twice, and the second pass failed with
          # `duplicate key value violates unique constraint "users_pkey"`. Nobody had seen it
          # because the restore died earlier, on the schema, for the unrelated reason this branch
          # also fixes.
          #
          # auth-data.sql stays in the backup and stays checksum-validated. It is now used as an
          # independent witness rather than as a second loader: if a future CLI release really does
          # start excluding auth from data.sql, the count check below fails loudly instead of
          # quietly restoring a database with no users.
          psql "$RESTORE_URL" -v ON_ERROR_STOP=1 -f "$EXTRACTED/schema.sql"
          {
            printf '%s\n' 'SET session_replication_role = replica;'
            cat "$EXTRACTED/data.sql"
            printf '%s\n' 'SET session_replication_role = origin;'
          } | psql "$RESTORE_URL" -v ON_ERROR_STOP=1

          # Rows between the auth.users COPY header and its terminating backslash-dot.
          EXPECTED_AUTH_USERS="$(awk '/^COPY "auth"\."users"/{flag=1;next} /^\\\.$/{flag=0} flag' \
            "$EXTRACTED/auth-data.sql" | grep -c . || true)"
          RESTORED_AUTH_USERS="$(psql "$RESTORE_URL" -Atqc 'select count(*) from auth.users;')"
          if [ "$EXPECTED_AUTH_USERS" != "$RESTORED_AUTH_USERS" ]; then
            printf 'Auth user count mismatch: auth-data.sql holds %s, restore produced %s\n' \
              "$EXPECTED_AUTH_USERS" "$RESTORED_AUTH_USERS" >&2
            exit 1
          fi
          printf 'Auth users restored and cross-checked against auth-data.sql: %s\n' "$RESTORED_AUTH_USERS"
      - name: Verify restored Auth and financial invariants
        run: |
          set -euo pipefail
          RESTORE_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          SOURCE="$GITHUB_WORKSPACE/.restore/plain/extracted/source-metrics.tsv"
          RESTORED="$GITHUB_WORKSPACE/.restore/plain/restored-metrics.tsv"

          psql "$RESTORE_URL" -X -qAt -v ON_ERROR_STOP=1 <<'SQL' > "$RESTORED"
          select 'auth_users' || E'\t' || count(*) from auth.users;
          select 'payments' || E'\t' || count(*) from public.payments;
          select 'payment_allocations' || E'\t' || count(*) from public.payment_allocations;
          select 'payment_receipts' || E'\t' || count(*) from public.payment_receipts;
          select 'receivable_items' || E'\t' || count(*) from public.receivable_items;
          select 'receivable_ledger_entries' || E'\t' || count(*) from public.receivable_ledger_entries;
          SQL

          for metric in auth_users payments payment_allocations payment_receipts receivable_items receivable_ledger_entries; do
            EXPECTED="$(awk -F '\t' -v metric="$metric" '$1 == metric { print $2 }' "$SOURCE")"
            ACTUAL="$(awk -F '\t' -v metric="$metric" '$1 == metric { print $2 }' "$RESTORED")"
            [[ "$EXPECTED" =~ ^[0-9]+$ ]]
            [[ "$ACTUAL" =~ ^[0-9]+$ ]]
            test "$EXPECTED" = "$ACTUAL" || {
              printf 'Restore count mismatch for %s: expected %s, got %s\n' "$metric" "$EXPECTED" "$ACTUAL" >&2
              exit 1
            }
          done

          # These checks do not expose IDs or amounts. Each query must return zero or the drill
          # fails closed. They prove the restored financial graph is internally coherent even
          # though replication triggers were disabled while loading the logical dump.
          psql "$RESTORE_URL" -X -qAt -v ON_ERROR_STOP=1 <<'SQL' > "$GITHUB_WORKSPACE/.restore/plain/invariants.tsv"
          select 'payments_missing_submitter' || E'\t' || count(*)
            from public.payments p left join auth.users u on u.id = p.submitted_by_user_id
           where u.id is null;
          select 'allocations_missing_payment' || E'\t' || count(*)
            from public.payment_allocations a left join public.payments p on p.id = a.payment_id and p.condominium_id = a.condominium_id
           where p.id is null;
          select 'allocations_missing_receivable' || E'\t' || count(*)
            from public.payment_allocations a left join public.receivable_items r on r.id = a.receivable_item_id and r.condominium_id = a.condominium_id
           where r.id is null;
          select 'receipts_missing_payment' || E'\t' || count(*)
            from public.payment_receipts r left join public.payments p on p.id = r.payment_id and p.condominium_id = r.condominium_id
           where p.id is null;
          select 'ledger_missing_payment' || E'\t' || count(*)
            from public.receivable_ledger_entries l left join public.payments p on p.id = l.payment_id and p.condominium_id = l.condominium_id
           where l.payment_id is not null and p.id is null;
          select 'ledger_missing_allocation' || E'\t' || count(*)
            from public.receivable_ledger_entries l left join public.payment_allocations a on a.id = l.payment_allocation_id and a.condominium_id = l.condominium_id
           where l.payment_allocation_id is not null and a.id is null;
          select 'approved_without_receipt' || E'\t' || count(*)
            from public.payments p left join public.payment_receipts r on r.payment_id = p.id
           where p.status = 'approved' and r.id is null;
          select 'allocation_without_credit_ledger' || E'\t' || count(*)
            from public.payment_allocations a left join public.receivable_ledger_entries l on l.payment_allocation_id = a.id
           where l.id is null;
          SQL

          while IFS=$'\t' read -r invariant failures; do
            [[ "$failures" =~ ^[0-9]+$ ]]
            test "$failures" -eq 0 || {
              printf 'Restore invariant failed: %s (%s violations)\n' "$invariant" "$failures" >&2
              exit 1
            }
          done < "$GITHUB_WORKSPACE/.restore/plain/invariants.tsv"

          TABLE_COUNT="$(psql "$RESTORE_URL" -Atqc "select count(*) from pg_tables where schemaname = 'public';")"
          test "$TABLE_COUNT" -gt 0
          printf 'Restore verified: %s public tables; Auth and financial aggregate counts match source.\n' "$TABLE_COUNT"
      - name: Remove restored plaintext and local database
        if: always()
        run: |
          rm -rf .restore
          supabase stop --no-backup || true
