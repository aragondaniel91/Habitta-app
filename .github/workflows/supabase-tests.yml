name: Supabase Database Tests

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-tests.yml'

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Start local database and apply migrations
        run: |
          set -o pipefail
          supabase db start --debug 2>&1 | tee supabase-db-start.log

      - name: Run pgTAP tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee supabase-test-db.log

      - name: Upload Supabase logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-test-logs
          path: |
            supabase-db-start.log
            supabase-test-db.log
          if-no-files-found: ignore

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
