name: Supabase Database Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # This check is required by the branch ruleset, so it has to report a conclusion on every
      # pull request. A `paths:` trigger does not run at all when nothing matches, and a required
      # check that never runs blocks the merge forever -- which is exactly what happened to a
      # SQL-only pull request once protection was switched on. The filter moved in here instead:
      # the job always reports, and does the expensive work only when it is relevant.
      - name: Decide whether this change needs the suite
        id: scope
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          CHANGED=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD)
          if echo "$CHANGED" | grep -qE '^(supabase/|\.github/workflows/supabase-tests\.yml|scripts/pre-launch-production-reset\.sh|scripts/release/reset-rehearsal-fixture\.sql)'; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo "No files in this change touch the database tests; reporting success without running it."
          fi

      - name: Set up Supabase CLI
        if: steps.scope.outputs.relevant == 'true'
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Start local database and apply migrations
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -o pipefail
          SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io supabase db start --debug 2>&1 | tee supabase-db-start.log

      - name: Run pgTAP tests
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -o pipefail
          SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io supabase test db 2>&1 | tee supabase-test-db.log

      - name: Run HAB-322 cross-tenant concurrency regression
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -o pipefail
          bash supabase/tests/hab322_concurrency.sh 2>&1 | tee hab322-concurrency.log

      # HAB-418: the pre-launch reset is rehearsed end to end against synthetic tenants on every
      # relevant change, so the procedure that will empty production is proven on the current schema
      # before anyone runs it there. Runs after pgTAP, whose tests all roll back.
      - name: Rehearse the pre-launch production reset on synthetic tenants
        if: steps.scope.outputs.relevant == 'true'
        env:
          PGHOST: 127.0.0.1
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          psql -X -q -v ON_ERROR_STOP=1 -f scripts/release/reset-rehearsal-fixture.sql > /dev/null
          printf '7e570000-0000-0000-0000-0000000000a1\n' > "$RUNNER_TEMP/survivors.txt"
          export SURVIVOR_ALLOWLIST="$RUNNER_TEMP/survivors.txt" REHEARSAL=true REQUIRE_SURVIVOR_PLATFORM_ADMIN=true REPORT_DIR="$RUNNER_TEMP/reset-report"
          FINGERPRINT="$(bash scripts/pre-launch-production-reset.sh | sed -n 's/^  inventory fingerprint  //p')"
          test -n "$FINGERPRINT"
          REHEARSAL_EXECUTE=true EXPECTED_INVENTORY_FINGERPRINT="$FINGERPRINT" \
            bash scripts/pre-launch-production-reset.sh 2>&1 | tee reset-rehearsal.log
          grep -q 'All verifications passed.' reset-rehearsal.log

      - name: Upload Supabase logs
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-test-logs
          path: |
            supabase-db-start.log
            supabase-test-db.log
            hab322-concurrency.log
            reset-rehearsal.log
          if-no-files-found: ignore

      - name: Stop local Supabase services
        if: always() && steps.scope.outputs.relevant == 'true'
        run: supabase stop --no-backup
