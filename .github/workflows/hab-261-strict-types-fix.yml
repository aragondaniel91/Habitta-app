name: HAB-261 Strict Types Fix

on:
  push:
    branches:
      - hab-261-people-ux-redesign

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hab-261-people-ux-redesign
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact optional-property fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path('apps/web/src/features/people/PeoplePanelV3.tsx')
          text = panel.read_text()
          old = '''                onInvite={
                  relationship.accessRoles.length
                    ? () => openInvitationFromRelationship(relationship)
                    : undefined
                }
'''
          new = '''                {...(relationship.accessRoles.length
                  ? { onInvite: () => openInvitationFromRelationship(relationship) }
                  : {})}
'''
          if text.count(old) != 2:
              raise SystemExit(f'expected 2 onInvite blocks, found {text.count(old)}')
          text = text.replace(old, new)
          if text.count('selectedId={selected?.id}') != 1:
              raise SystemExit('selectedId contract not found exactly once')
          text = text.replace('selectedId={selected?.id}', 'selectedId={selected?.id ?? null}')
          if text.count('          initialUnitId={relationTarget.unitId}\n') != 1:
              raise SystemExit('initialUnitId contract not found exactly once')
          text = text.replace(
              '          initialUnitId={relationTarget.unitId}\n',
              "          {...(relationTarget.unitId ? { initialUnitId: relationTarget.unitId } : {})}\n",
          )
          panel.write_text(text)

          editor = Path('apps/web/src/features/people/PersonEditorDrawerV3.tsx')
          text = editor.read_text()
          old_update = "    if (key in errors) setErrors((current) => ({ ...current, [key]: undefined }));\n"
          new_update = '''    if (key in errors) {
      setErrors((current) => {
        const next = { ...current };
        delete next[key as keyof Errors];
        return next;
      });
    }
'''
          if text.count(old_update) != 1:
              raise SystemExit('error clearing update contract not found exactly once')
          text = text.replace(old_update, new_update)
          old_relationship = '''    setErrors((current) => ({
      ...current,
      unitId: undefined,
      ownershipPercentage: undefined,
    }));
'''
          new_relationship = '''    setErrors((current) => {
      const next = { ...current };
      delete next.unitId;
      delete next.ownershipPercentage;
      return next;
    });
'''
          if text.count(old_relationship) != 1:
              raise SystemExit('relationship error clearing contract not found exactly once')
          text = text.replace(old_relationship, new_relationship)
          editor.write_text(text)
          PY
      - name: Format touched files
        run: >-
          pnpm exec prettier --write
          apps/web/src/features/people/PeoplePanelV3.tsx
          apps/web/src/features/people/PersonEditorDrawerV3.tsx
      - name: Verify web typecheck
        run: pnpm --filter @habitta/web typecheck
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/people/PeoplePanelV3.tsx apps/web/src/features/people/PersonEditorDrawerV3.tsx
          git commit -m "fix(HAB-261): satisfy strict optional property types"
          git push origin HEAD:hab-261-people-ux-redesign
