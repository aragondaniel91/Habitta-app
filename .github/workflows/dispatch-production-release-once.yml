name: Dispatch Production Release Once

on:
  push:
    branches:
      - ops/dispatch-production-73640576

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical production release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'production-release.yml',
              ref: 'main',
              inputs: {
                release_ref: '736405763e4c2870d4ac857eea6699b63499ae12',
                confirmation: 'DEPLOY-HABITTA-PRODUCTION',
                confirm_project_ref: 'kgsfaahixbcwcmykmhat'
              }
            });
