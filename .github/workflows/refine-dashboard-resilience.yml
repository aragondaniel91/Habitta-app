name: Refine dashboard resilience

on:
  push:
    branches:
      - fix/dashboard-partial-data-resilience

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: python scripts/refactor-dashboard-resilience.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit refactor
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/AdministrativeDashboard.tsx apps/web/src/lib/dashboard-sources.ts apps/web/src/lib/dashboard-sources.test.ts
          git commit -m "Make dashboard resilient to partial API failures"
          git push origin HEAD:${{ github.ref_name }}
