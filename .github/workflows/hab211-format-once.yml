name: HAB-211 One-shot Formatter

on:
  push:
    branches: [feat/hab-211-people-workspace]

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hab-211-people-workspace
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - name: Commit formatted files if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/people/PeoplePanel.tsx \
            apps/web/src/features/people/relationship-model.test.ts \
            apps/web/src/features/people/types.ts
          git commit -m "style(people): apply Prettier"
          git push origin HEAD:feat/hab-211-people-workspace
