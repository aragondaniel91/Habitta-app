name: Fix Private Document Lint

on:
  push:
    branches:
      - feat/private-operational-documents

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/private-operational-documents
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Replace control-character regular expression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/private-document-routes.ts')
          source = path.read_text()
          old = """const safeFilename = (value: string) =>
            value
              .normalize('NFKC')
              .replace(/[\\u0000-\\u001f\\u007f<>:\"/\\\\|?*]/g, '_')
              .trim()
              .slice(0, 255) || 'documento';
          """
          new = """const sanitizeFilenameCharacter = (character: string) => {
            const codePoint = character.codePointAt(0) ?? 0;
            return codePoint <= 0x1f || codePoint === 0x7f || '<>:\"/\\\\|?*'.includes(character)
              ? '_'
              : character;
          };

          const safeFilename = (value: string) =>
            Array.from(value.normalize('NFKC'), sanitizeFilenameCharacter).join('').trim().slice(0, 255) ||
            'documento';
          """
          if old not in source:
              raise SystemExit('Expected filename sanitizer block not found')
          path.write_text(source.replace(old, new))
          PY

          pnpm exec prettier --write apps/api/src/private-document-routes.ts
          pnpm --filter @habitta/api lint

      - name: Commit fix and remove temporary workflow
        run: |
          git rm .github/workflows/fix-private-documents-lint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix private document filename sanitizer lint"
          git push origin HEAD:feat/private-operational-documents
