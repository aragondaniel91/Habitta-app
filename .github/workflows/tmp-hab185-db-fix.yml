name: Temporary HAB-185 DB fix

on:
  push:
    branches:
      - agent/hab-185-recurring-dues-foundation
    paths:
      - '.github/workflows/tmp-hab185-db-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260815205032_hab185_recurring_dues_foundation.sql')
          s = migration.read_text()
          old = "  create temporary table hab185_scope_units on commit drop as\n"
          new = "  drop table if exists pg_temp.hab185_scope_units;\n  drop table if exists pg_temp.hab185_allocations;\n\n  create temporary table hab185_scope_units on commit drop as\n"
          if s.count(old) != 1:
              raise SystemExit('scope temp-table anchor mismatch')
          s = s.replace(old, new)
          migration.write_text(s)

          test = Path('supabase/tests/hab185_recurring_dues.sql')
          s = test.read_text()
          old = "'participation_percentage',100.01,'USD','2026-09-01',1,10,null)$$"
          new = "'participation_percentage',100.01,'USD','2026-09-01'::date,1::smallint,10::smallint,null::date)$$"
          if s.count(old) != 1:
              raise SystemExit('RPC cast anchor mismatch')
          s = s.replace(old, new)

          old = "select throws_ok($$update public.recurring_charge_runs set total_amount=1 where period='2026-09'$$, 'P0001', 'posted recurring charge runs are immutable', 'posted occurrence snapshot cannot be repriced');"
          new = "reset role;\nselect throws_ok($$update public.recurring_charge_runs set total_amount=1 where period='2026-09'$$, 'P0001', 'posted recurring charge runs are immutable', 'posted occurrence snapshot cannot be repriced');\nset local role authenticated;\nselect set_config('request.jwt.claim.sub', '00000000-0000-0000-0000-000000018501', true);"
          if s.count(old) != 1:
              raise SystemExit('immutability test anchor mismatch')
          s = s.replace(old, new)
          test.write_text(s)
          PY
          rm .github/workflows/tmp-hab185-db-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase .github/workflows/tmp-hab185-db-fix.yml
          git commit -m 'fix: harden recurring dues database tests'
          git push origin HEAD:agent/hab-185-recurring-dues-foundation
