name: HAB-262 Lint Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hab-262-units-ux-redesign
      - name: Remove exact unused import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/pages/UnitsPage.tsx')
          text = path.read_text()
          old = "import { Badge, Button, EmptyState, Select, Skeleton, Surface } from '../components/ui';"
          new = "import { Badge, Button, EmptyState, Select, Skeleton } from '../components/ui';"
          if text.count(old) != 1:
              raise SystemExit(f'expected exact import once, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/pages/UnitsPage.tsx
          git commit -m "fix(HAB-262): remove unused Surface import"
          git push origin HEAD:hab-262-units-ux-redesign
