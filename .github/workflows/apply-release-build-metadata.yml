name: Apply release build metadata hardening

on:
  push:
    branches:
      - fix/release-build-metadata

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-build-metadata
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/apply-release-build-metadata.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/apply-release-build-metadata.mjs apps/api/src/index.ts apps/api/src/build-metadata.ts apps/api/src/build-metadata.test.ts apps/api/src/notifications/types.ts apps/api/test/health.test.ts apps/api/wrangler.jsonc scripts/release/development-smoke.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Commit validated code changes
        run: |
          rm scripts/apply-release-build-metadata.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Worker release build metadata"
          git push origin HEAD:fix/release-build-metadata
