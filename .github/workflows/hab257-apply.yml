name: HAB-257 apply maintenance form migration

on:
  push:
    branches:
      - hab-257-maintenance-shared-form-layout
    paths:
      - .github/workflows/hab257-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hab-257-maintenance-shared-form-layout
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic HAB-257 migration
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          page_path = Path('apps/web/src/pages/MaintenancePageBase.tsx')
          css_path = Path('apps/web/src/maintenance.css')
          matrix_path = Path('docs/frontend/form-parity-matrix.md')
          test_path = Path('apps/web/src/hab257-maintenance-shared-form-layout.test.ts')

          page = page_path.read_text()
          original_page = page

          drawer_import = "import { Drawer } from '../components/Drawer';\n"
          layout_import = "import { FormActions, FormGrid } from '../components/FormLayout';\n"
          assert page.count(drawer_import) == 1
          assert layout_import not in page
          page = page.replace(drawer_import, drawer_import + layout_import, 1)

          grid_pattern = re.compile(
              r'(?P<indent>^[ \\t]*)<div className="maintenance-form-grid(?P<three> maintenance-form-grid--three)?">\\n(?P<body>.*?)(?P=indent)</div>',
              re.MULTILINE | re.DOTALL,
          )
          matches = list(grid_pattern.finditer(page))
          assert len(matches) == 12, f'expected 12 maintenance grids, found {len(matches)}'
          assert sum(1 for match in matches if match.group('three')) == 3

          def replace_grid(match: re.Match[str]) -> str:
              indent = match.group('indent')
              opening = '<FormGrid columns={3}>' if match.group('three') else '<FormGrid>'
              return f"{indent}{opening}\\n{match.group('body')}{indent}</FormGrid>"

          page = grid_pattern.sub(replace_grid, page)

          actions_pattern = re.compile(
              r'(?P<indent>^[ \\t]*)<div className="maintenance-form__actions">\\n(?P<body>.*?)(?P=indent)</div>',
              re.MULTILINE | re.DOTALL,
          )
          action_matches = list(actions_pattern.finditer(page))
          assert len(action_matches) == 4, f'expected 4 maintenance form footers, found {len(action_matches)}'

          def replace_actions(match: re.Match[str]) -> str:
              indent = match.group('indent')
              return f"{indent}<FormActions>\\n{match.group('body')}{indent}</FormActions>"

          page = actions_pattern.sub(replace_actions, page)

          assert 'maintenance-form-grid' not in page
          assert 'maintenance-form__actions' not in page
          assert page.count('<FormGrid') == 12
          assert page.count('<FormGrid columns={3}>') == 3
          assert page.count('<FormActions>') == 4
          assert 'maintenance-detail__actions' in page

          invariants = [
              'supportsBuildingStructure(propertyTopology)',
              'unitReferenceLabel',
              '<option key={building.id} value={building.id}>',
              '<option key={unit.id} value={unit.id}>',
              '<option key={asset.id} value={asset.id}>',
              '<option key={vendor.id} value={vendor.id}>',
              'expectedVersion: workOrder.version',
              "note.trim().length < 3",
              'scheduledFor: scheduledFor ? new Date(scheduledFor).toISOString() : undefined',
              'dueOn: dueOn || undefined',
              'amount: amount ? Number(amount) : undefined',
              'currencyCode: amount ? currency : undefined',
          ]
          for invariant in invariants:
              assert invariant in original_page and invariant in page, invariant

          page_path.write_text(page)

          css = css_path.read_text()
          grid_css = """.maintenance-form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.85rem;
          }

          .maintenance-form-grid--three {
            grid-template-columns: repeat(3, minmax(0, 1fr));
          }

          """
          assert css.count(grid_css) == 1
          css = css.replace(grid_css, '', 1)
          old_action_selector = ".maintenance-form__actions,\n.maintenance-detail__actions {"
          assert css.count(old_action_selector) == 1
          css = css.replace(old_action_selector, '.maintenance-detail__actions {', 1)
          responsive_refs = "    .maintenance-form-grid,\n    .maintenance-form-grid--three,\n"
          assert css.count(responsive_refs) == 1
          css = css.replace(responsive_refs, '', 1)
          assert 'maintenance-form-grid' not in css
          assert 'maintenance-form__actions' not in css
          assert '.maintenance-detail__actions {' in css
          css_path.write_text(css)

          matrix = matrix_path.read_text()
          old_row = '| Mantenimiento | MaintenancePageBase editor | deferred | Parcial | Parcial | No | No | Pendiente de prueba específica | No encontrado | Sólo auditoría | Se revisará junto con sus selectores de topología. |'
          new_row = '| Mantenimiento | Asset, Plan, Work Order y Service Log forms | compliant | Sí | Sí | Sí | Sí | FormGrid compartido 2/3→1 y acciones compartidas | No encontrado | Completada | Conserva topología, UUIDs, optimistic versioning, transiciones y evidencia financiera de service logs. |'
          assert matrix.count(old_row) == 1
          matrix_path.write_text(matrix.replace(old_row, new_row, 1))

          test_path.write_text("""import { readFileSync } from 'node:fs';
          import { describe, expect, it } from 'vitest';

          const source = (relative: string) => readFileSync(new URL(relative, import.meta.url), 'utf8');

          const maintenanceSource = source('./pages/MaintenancePageBase.tsx');
          const maintenanceStyles = source('./maintenance.css');
          const sharedStyles = source('./styles.css');
          const parityMatrix = source('../../../docs/frontend/form-parity-matrix.md');

          describe('HAB-257 Maintenance shared form layout', () => {
            it('migrates exactly the compatible Maintenance grids and form footers', () => {
              expect(maintenanceSource).toContain(
                \"import { FormActions, FormGrid } from '../components/FormLayout'\",
              );
              expect(maintenanceSource.match(/<FormGrid/g)).toHaveLength(12);
              expect(maintenanceSource.match(/<FormGrid columns=\\{3\\}>/g)).toHaveLength(3);
              expect(maintenanceSource.match(/<FormActions>/g)).toHaveLength(4);
              expect(maintenanceSource).not.toContain('maintenance-form-grid');
              expect(maintenanceSource).not.toContain('maintenance-form__actions');
              expect(maintenanceSource).toContain('maintenance-detail__actions');
            });

            it('preserves topology-aware UUID-backed asset locations', () => {
              expect(maintenanceSource).toContain('supportsBuildingStructure(propertyTopology)');
              expect(maintenanceSource).toContain('unitReferenceLabel');
              expect(maintenanceSource).toContain('<option key={building.id} value={building.id}>');
              expect(maintenanceSource).toContain('<option key={unit.id} value={unit.id}>');
              expect(maintenanceSource).toContain('<option key={asset.id} value={asset.id}>');
              expect(maintenanceSource).toContain('<option key={vendor.id} value={vendor.id}>');
            });

            it('preserves work-order concurrency, lifecycle notes and dates', () => {
              expect(maintenanceSource).toContain('expectedVersion: workOrder.version');
              expect(maintenanceSource).toContain('note.trim().length < 3');
              expect(maintenanceSource).toContain(
                'scheduledFor: scheduledFor ? new Date(scheduledFor).toISOString() : undefined',
              );
              expect(maintenanceSource).toContain('dueOn: dueOn || undefined');
            });

            it('preserves service-log amount and currency semantics', () => {
              expect(maintenanceSource).toContain('amount: amount ? Number(amount) : undefined');
              expect(maintenanceSource).toContain('currencyCode: amount ? currency : undefined');
            });

            it('removes only dead local form-layout ownership and inherits shared responsive grids', () => {
              expect(maintenanceStyles).not.toContain('maintenance-form-grid');
              expect(maintenanceStyles).not.toContain('maintenance-form__actions');
              expect(maintenanceStyles).toContain('.maintenance-detail__actions {');
              expect(sharedStyles).toContain(\".form-grid[data-columns='2']\");
              expect(sharedStyles).toContain(\".form-grid[data-columns='3']\");
              expect(sharedStyles).toContain('grid-template-columns: minmax(0, 1fr)');
            });

            it('marks Maintenance compliant only after the focused migration contract exists', () => {
              expect(parityMatrix).toContain(
                '| Mantenimiento | Asset, Plan, Work Order y Service Log forms | compliant | Sí | Sí | Sí | Sí |',
              );
            });
          });
          """)
          PY
      - name: Format changed files with repository Prettier
        run: |
          pnpm exec prettier --write \
            apps/web/src/pages/MaintenancePageBase.tsx \
            apps/web/src/maintenance.css \
            apps/web/src/hab257-maintenance-shared-form-layout.test.ts \
            docs/frontend/form-parity-matrix.md
      - name: Verify focused invariants before commit
        run: |
          test "$(grep -o '<FormGrid' apps/web/src/pages/MaintenancePageBase.tsx | wc -l)" -eq 12
          test "$(grep -o '<FormActions>' apps/web/src/pages/MaintenancePageBase.tsx | wc -l)" -eq 4
          ! grep -q 'maintenance-form-grid' apps/web/src/pages/MaintenancePageBase.tsx
          ! grep -q 'maintenance-form__actions' apps/web/src/pages/MaintenancePageBase.tsx
          grep -q 'maintenance-detail__actions' apps/web/src/pages/MaintenancePageBase.tsx
          grep -q 'expectedVersion: workOrder.version' apps/web/src/pages/MaintenancePageBase.tsx
          git diff --check
      - name: Commit product migration and remove temporary runner
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/hab257-apply.yml
          git add apps/web/src/pages/MaintenancePageBase.tsx apps/web/src/maintenance.css apps/web/src/hab257-maintenance-shared-form-layout.test.ts docs/frontend/form-parity-matrix.md
          git commit -m 'HAB-257 migrate Maintenance forms to shared layout'
          git push origin HEAD:hab-257-maintenance-shared-form-layout
