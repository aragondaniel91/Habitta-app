name: Temp HAB-183 Autofix

on:
  push:
    branches:
      - agent/hab-183-condo-profile-topology

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hab-183-condo-profile-topology
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply deterministic domain fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          migration = Path('supabase/migrations/20260815183315_hab183_condominium_profile_topology.sql')
          text = migration.read_text()
          text, count = re.subn(
              r'grant usage on type public\.condominium_property_topology to authenticated, service_role;\n\n',
              '',
              text,
              count=1,
          )
          assert count == 1, f'expected one enum grant, found {count}'
          migration.write_text(text)

          onboarding = Path('apps/web/src/lib/adminOnboarding.ts')
          text = onboarding.read_text()
          legal_validation = re.compile(
              r"  const hasLegalType = Boolean\(input\.legalIdType\.trim\(\)\);\n"
              r"  const hasLegalNumber = Boolean\(input\.legalIdNumber\.trim\(\)\);\n"
              r"  if \(hasLegalType !== hasLegalNumber\) \{\n"
              r"    if \(!hasLegalType\) errors\.legalIdType = 'Indica el tipo de identificación legal\.';\n"
              r"    if \(!hasLegalNumber\) errors\.legalIdNumber = 'Indica el número de identificación legal\.';\n"
              r"  \}\n"
          )
          replacement = (
              "  const hasLegalType = Boolean(input.legalIdType.trim());\n"
              "  const hasLegalNumber = Boolean(input.legalIdNumber.trim());\n"
              "  if (hasLegalNumber && !hasLegalType) {\n"
              "    errors.legalIdType = 'Indica el tipo de identificación legal.';\n"
              "  }\n"
          )
          text, count = legal_validation.subn(replacement, text, count=1)
          assert count == 1, f'expected one legal validation block, found {count}'

          legal_payload = re.compile(
              r"    legal_name: input\.legalName\.trim\(\) \|\| null,\n"
              r"    legal_id_type: input\.legalIdType\.trim\(\) \|\| null,\n"
              r"    legal_id_number: input\.legalIdNumber\.trim\(\) \|\| null,\n"
          )
          replacement = (
              "    legal_name: input.legalName.trim() || null,\n"
              "    legal_id_type: input.legalIdNumber.trim() ? input.legalIdType.trim() || null : null,\n"
              "    legal_id_number: input.legalIdNumber.trim() || null,\n"
          )
          text, count = legal_payload.subn(replacement, text, count=1)
          assert count == 1, f'expected one legal payload block, found {count}'
          onboarding.write_text(text)

          test = Path('apps/web/src/admin-onboarding-domain.test.ts')
          text = test.read_text()
          legal_test = re.compile(
              r"  it\('keeps legal identification optional but requires type and number as a pair', \(\) => \{.*?\n  \}\);",
              re.DOTALL,
          )
          replacement = """  it('keeps legal identification optional while requiring a type when a number is entered', () => {
            const suggestedOnly = { ...validInput(), legalIdType: 'RIF', legalIdNumber: '' };
            expect(validateAdminOnboarding(suggestedOnly, true).legalIdNumber).toBeUndefined();

            const numberWithoutType = {
              ...validInput(),
              legalIdType: '',
              legalIdNumber: 'J-12345678-9',
            };
            expect(validateAdminOnboarding(numberWithoutType, true).legalIdType).toBeTruthy();

            const omitted = { ...validInput(), legalIdType: '', legalIdNumber: '' };
            expect(validateAdminOnboarding(omitted, true).legalIdNumber).toBeUndefined();

            const complete = { ...validInput(), legalIdType: 'RIF', legalIdNumber: 'J-12345678-9' };
            expect(validateAdminOnboarding(complete, true).legalIdNumber).toBeUndefined();
          });"""
          text, count = legal_test.subn(replacement, text, count=1)
          assert count == 1, f'expected one legal test block, found {count}'
          test.write_text(text)
          PY

      - name: Format HAB-183 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/admin-onboarding-domain.test.ts \
            apps/web/src/components/AdminOnboardingWizard.tsx \
            apps/web/src/components/CondominiumProfileFields.tsx \
            apps/web/src/condominium-profile.css \
            apps/web/src/lib/adminOnboarding.ts \
            apps/web/src/pages/AddCondominiumPage.tsx \
            apps/web/src/pages/StructureManagementPage.tsx \
            supabase/migrations/20260815183315_hab183_condominium_profile_topology.sql

      - name: Commit deterministic fixes
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/admin-onboarding-domain.test.ts \
            apps/web/src/components/AdminOnboardingWizard.tsx \
            apps/web/src/components/CondominiumProfileFields.tsx \
            apps/web/src/condominium-profile.css \
            apps/web/src/lib/adminOnboarding.ts \
            apps/web/src/pages/AddCondominiumPage.tsx \
            apps/web/src/pages/StructureManagementPage.tsx \
            supabase/migrations/20260815183315_hab183_condominium_profile_topology.sql
          git commit -m 'fix: normalize HAB-183 migration and onboarding UX'
          git push origin HEAD:agent/hab-183-condo-profile-topology
