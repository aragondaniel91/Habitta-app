name: HAB-133 Notification Runtime

on:
  push:
    branches:
      - agent/hab-133-maintenance-notifications

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}
      - name: Start local database and apply migrations
        run: supabase db start --debug
      - name: Inspect notification runtime
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off
          select pg_get_functiondef('public.expand_notification_event(uuid)'::regprocedure);
          select p.oid::regprocedure as procedure, pg_get_function_identity_arguments(p.oid) as args, p.prosrc
          from pg_proc p
          where p.pronamespace = 'public'::regnamespace
            and p.proname in ('expand_notification_event','notification_type_from_event')
          order by p.proname;
          select t.typname, e.enumsortorder, e.enumlabel
          from pg_type t
          join pg_enum e on e.enumtypid = t.oid
          where t.typname in ('notification_type','notification_event_type')
          order by t.typname, e.enumsortorder;
          SQL
      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
