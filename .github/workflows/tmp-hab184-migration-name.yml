name: Temporary HAB-184 migration name

on:
  push:
    branches:
      - agent/hab-184-people-relationships
    paths:
      - '.github/workflows/tmp-hab184-migration-name.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}
      - name: Generate migration file
        run: |
          set -euo pipefail
          supabase migration new hab184_people_relationships
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations
          git commit -m 'chore: generate HAB-184 migration'
          git push origin HEAD:agent/hab-184-people-relationships
