name: HAB322 Apply SQL Alias Fix

on:
  push:
    branches:
      - hab-322-tenant-purge-no-global-locks

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hab-322-tenant-purge-no-global-locks
      - name: Apply reserved-alias fix
        run: python3 .github/scripts/hab322_fix_alias.py
      - name: Remove branch tooling and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260825041500_hab322_tenant_purge_no_global_locks.sql
          git rm .github/workflows/hab322-fix-alias.yml .github/scripts/hab322_fix_alias.py
          git commit -m 'fix HAB-322 reserved SQL alias'
          git push origin HEAD:hab-322-tenant-purge-no-global-locks
