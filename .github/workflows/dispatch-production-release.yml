name: Dispatch Production Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-production-release.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded production release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Dispatching the guarded production workflow from main."
          PAYLOAD=$(jq -cn '{
            ref: "main",
            inputs: {
              release_ref: "main",
              confirmation: "DEPLOY-HABITTA-PRODUCTION",
              confirm_project_ref: "kgsfaahixbcwcmykmhat"
            }
          }')
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/production-release.yml/dispatches" \
            --data "$PAYLOAD"
