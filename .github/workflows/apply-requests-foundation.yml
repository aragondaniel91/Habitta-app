name: Apply requests foundation

on:
  push:
    branches:
      - feat/backend-requests-foundation
    paths:
      - .github/workflows/apply-requests-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize request foundation
        run: |
          cat scripts/request-foundation-payload/part-* | base64 --decode | gzip --decompress > /tmp/apply_requests_foundation.py
          python /tmp/apply_requests_foundation.py
          rm -rf scripts/request-foundation-payload
          rm -f .github/workflows/inspect-requests-foundation.yml
          rm -f .github/workflows/apply-requests-foundation.yml
          pnpm format
      - name: Commit foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add secure service requests backend foundation"
          git push origin HEAD:${{ github.ref_name }}
