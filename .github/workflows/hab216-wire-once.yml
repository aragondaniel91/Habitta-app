name: HAB-216 Wire People Once

on:
  push:
    branches: [feat/hab-216-resident-invitation-email]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hab-216-resident-invitation-email
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/hab216-wire-people.py
      - run: pnpm format
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/people/PeoplePanel.tsx apps/web/src/features/people/people-workspace.css apps/api/test/resident-invitations-route.test.ts
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "feat(hab216): wire factual resident email delivery state"
          git push origin HEAD:feat/hab-216-resident-invitation-email
