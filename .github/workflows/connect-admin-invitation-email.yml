name: Connect Admin Invitation Email

on:
  push:
    branches:
      - feat/password-auth-admin-onboarding

permissions:
  contents: write

jobs:
  connect:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip invite-route-bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/password-auth-admin-onboarding

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Mount administrator invitation email route
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/api/src/index.ts';
          let source = fs.readFileSync(path, 'utf8');
          const importLine = "import { adminInvitationRoutes } from './admin-invitations';\n";
          if (!source.includes(importLine.trim())) {
            const marker = "import { consumeNotificationQueue, runScheduled } from './notifications/worker';\n";
            if (!source.includes(marker)) throw new Error('Import insertion marker not found');
            source = source.replace(marker, `${importLine}${marker}`);
          }
          const routeLine = "app.route('/v1/condominiums', adminInvitationRoutes);\n";
          if (!source.includes(routeLine.trim())) {
            const marker = "});\nconst rest = (\n";
            if (!source.includes(marker)) throw new Error('Route insertion marker not found');
            source = source.replace(marker, `});\n${routeLine}const rest = (\n`);
          }
          fs.writeFileSync(path, source);
          NODE

      - run: pnpm format

      - name: Commit route connection
        run: |
          if git diff --quiet; then
            echo "Route already connected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/index.ts apps/api/src/admin-invitations.ts
          git commit -m "Connect administrator invitation email route [skip invite-route-bot]"
          git push origin HEAD:feat/password-auth-admin-onboarding
