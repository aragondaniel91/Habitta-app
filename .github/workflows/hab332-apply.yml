name: HAB332 Apply Patch

on:
  push:
    branches:
      - hab-332-recurring-dues-concept-ux

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hab-332-recurring-dues-concept-ux
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply HAB-332 UX patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          workspace_path = 'apps/web/src/features/receivables/RecurringDuesWorkspace.tsx'
          workspace = Path(workspace_path)
          text = workspace.read_text()

          text = text.replace(
              "import { FormActions, FormGrid } from '../../components/FormLayout';",
              "import { FormActions, FormGrid, FormSection } from '../../components/FormLayout';",
              1,
          )
          text = text.replace(
              "  onLedgerChanged: () => void;\n};",
              "  onLedgerChanged: () => void;\n  onCreateConcept: () => void;\n};",
              1,
          )
          text = text.replace(
              "  canManage,\n  onLedgerChanged,\n}: Props) {",
              "  canManage,\n  onLedgerChanged,\n  onCreateConcept,\n}: Props) {",
              1,
          )
          text = text.replace(
              "  const activeScopes = scopes.filter((scope) => scope.is_active);\n  const activePlans = plans.filter((plan) => plan.status === 'active');",
              "  const activeScopes = scopes.filter((scope) => scope.is_active);\n  const activeConcepts = useMemo(\n    () => concepts.filter((concept) => concept.is_active !== false),\n    [concepts],\n  );\n  const activePlans = plans.filter((plan) => plan.status === 'active');",
              1,
          )
          text = text.replace(
              "  const openPlanDrawer = () => {\n    setPlanForm(initialPlanForm(concepts, activeScopes));\n    setPlanDrawerOpen(true);\n  };\n\n  const saveScope",
              "  const openPlanDrawer = () => {\n    setPlanForm(initialPlanForm(concepts, activeScopes));\n    setPlanDrawerOpen(true);\n  };\n\n  useEffect(() => {\n    if (!planDrawerOpen || !activeConcepts.length) return;\n    setPlanForm((current) => {\n      if (activeConcepts.some((concept) => concept.id === current.conceptId)) return current;\n      const concept =\n        activeConcepts.find((item) => item.category === 'regular_dues') ?? activeConcepts[0];\n      if (!concept) return current;\n      return {\n        ...current,\n        conceptId: concept.id,\n        name:\n          current.name === 'Cuota ordinaria mensual' ? `${concept.name} mensual` : current.name,\n        amount: concept.default_amount ?? current.amount,\n        currencyCode: concept.default_currency_code ?? current.currencyCode,\n      };\n    });\n  }, [activeConcepts, planDrawerOpen]);\n\n  const saveScope",
              1,
          )

          start_marker = '            <FormGrid>\n              <Field label="Concepto">'
          end_marker = '            <div className="recurring-dues-safety-note">'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          new_form = '''            <FormSection
              actions={
                activeConcepts.length ? (
                  <Button onClick={onCreateConcept} size="sm" type="button" variant="secondary">
                    Nuevo concepto
                  </Button>
                ) : undefined
              }
              description="Define qué se cobra y a qué ámbito financiero se aplicará."
              title="Definición"
              variant="card"
            >
              <FormGrid>
                {activeConcepts.length ? (
                  <Field label="Concepto" required>
                    <Select
                      required
                      value={planForm.conceptId}
                      onChange={(event) =>
                        setPlanForm((current) => ({ ...current, conceptId: event.target.value }))
                      }
                    >
                      <option value="">Selecciona un concepto</option>
                      {activeConcepts.map((concept) => (
                        <option key={concept.id} value={concept.id}>
                          {concept.name}
                        </option>
                      ))}
                    </Select>
                  </Field>
                ) : (
                  <div className="recurring-dues-concept-empty" role="status">
                    <div>
                      <strong>Concepto</strong>
                      <span>No hay conceptos de cobro activos.</span>
                    </div>
                    <Button onClick={onCreateConcept} size="sm" type="button" variant="secondary">
                      Crear primer concepto
                    </Button>
                  </div>
                )}
                <Field label="Ámbito financiero" required>
                  <Select
                    required
                    value={planForm.financialScopeId}
                    onChange={(event) =>
                      setPlanForm((current) => ({
                        ...current,
                        financialScopeId: event.target.value,
                      }))
                    }
                  >
                    <option value="">Selecciona un ámbito</option>
                    {activeScopes.map((scope) => (
                      <option key={scope.id} value={scope.id}>
                        {scope.name}
                      </option>
                    ))}
                  </Select>
                </Field>
              </FormGrid>
              <Field label="Nombre del plan" required>
                <input
                  className="input"
                  maxLength={160}
                  onChange={(event) =>
                    setPlanForm((current) => ({ ...current, name: event.target.value }))
                  }
                  required
                  value={planForm.name}
                />
              </Field>
            </FormSection>

            <FormSection
              description={
                planForm.distribution === 'participation_percentage'
                  ? 'El presupuesto total del período se reparte proporcionalmente según la alícuota de cada unidad.'
                  : 'Cada unidad del ámbito recibe exactamente el mismo monto.'
              }
              title="Reparto y monto"
              variant="card"
            >
              <FormGrid columns={3}>
                <Field label="Distribución" required>
                  <Select
                    value={planForm.distribution}
                    onChange={(event) =>
                      setPlanForm((current) => ({
                        ...current,
                        distribution: event.target.value as Distribution,
                      }))
                    }
                  >
                    <option value="participation_percentage">Por alícuota / participación</option>
                    <option value="fixed_per_unit">Monto fijo por unidad</option>
                  </Select>
                </Field>
                <Field
                  label={
                    planForm.distribution === 'participation_percentage'
                      ? 'Presupuesto total por período'
                      : 'Monto por unidad'
                  }
                  required
                >
                  <input
                    className="input"
                    inputMode="decimal"
                    onChange={(event) =>
                      setPlanForm((current) => ({ ...current, amount: event.target.value }))
                    }
                    pattern="^(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$"
                    placeholder="0.00"
                    required
                    value={planForm.amount}
                  />
                </Field>
                <Field label="Moneda" required>
                  <input
                    className="input"
                    maxLength={3}
                    minLength={3}
                    onChange={(event) =>
                      setPlanForm((current) => ({
                        ...current,
                        currencyCode: event.target.value.toUpperCase(),
                      }))
                    }
                    pattern="[A-Z]{3}"
                    required
                    value={planForm.currencyCode}
                  />
                </Field>
              </FormGrid>
            </FormSection>

            <FormSection
              description="Configura el ciclo mensual y por cuánto tiempo estará vigente el plan."
              title="Calendario"
              variant="card"
            >
              <FormGrid>
                <Field label="Día de emisión" required>
                  <input
                    className="input"
                    max="28"
                    min="1"
                    onChange={(event) =>
                      setPlanForm((current) => ({ ...current, issueDay: event.target.value }))
                    }
                    required
                    type="number"
                    value={planForm.issueDay}
                  />
                </Field>
                <Field label="Día de vencimiento" required>
                  <input
                    className="input"
                    max="28"
                    min={Number(planForm.issueDay) || 1}
                    onChange={(event) =>
                      setPlanForm((current) => ({ ...current, dueDay: event.target.value }))
                    }
                    required
                    type="number"
                    value={planForm.dueDay}
                  />
                </Field>
              </FormGrid>
              <FormGrid>
                <Field label="Comienza" required>
                  <input
                    className="input"
                    onChange={(event) =>
                      setPlanForm((current) => ({ ...current, startsOn: event.target.value }))
                    }
                    required
                    type="date"
                    value={planForm.startsOn}
                  />
                </Field>
                <Field
                  hint="Opcional. Déjalo vacío para una cuota recurrente indefinida."
                  label="Finaliza"
                >
                  <input
                    className="input"
                    min={planForm.startsOn}
                    onChange={(event) =>
                      setPlanForm((current) => ({ ...current, endsOn: event.target.value }))
                    }
                    type="date"
                    value={planForm.endsOn}
                  />
                </Field>
              </FormGrid>
            </FormSection>
'''
          text = text[:start] + new_form + text[end:]
          text = text.replace(
              "              <Button disabled={busyId === 'plan'} type=\"submit\">\n                {busyId === 'plan' ? 'Creando…' : 'Crear plan y programar primer período'}\n              </Button>",
              "              <Button\n                disabled={\n                  busyId === 'plan' ||\n                  !activeConcepts.length ||\n                  !planForm.conceptId ||\n                  !planForm.financialScopeId\n                }\n                type=\"submit\"\n              >\n                {busyId === 'plan' ? 'Creando…' : 'Crear y programar'}\n              </Button>",
              1,
          )
          workspace.write_text(text)

          replace_once(
              'apps/web/src/pages/ReceivablesPage.tsx',
              "        onLedgerChanged={() => void load(true)}\n        session={session}",
              "        onCreateConcept={() => openDrawer('concept')}\n        onLedgerChanged={() => void load(true)}\n        session={session}",
          )

          css_path = Path('apps/web/src/recurring-dues.css')
          css = css_path.read_text()
          marker = '''.recurring-dues-form .input,
.recurring-dues-form .select {
  width: 100%;
}
'''
          addition = marker + '''
.recurring-dues-form .form-section {
  min-width: 0;
}

.recurring-dues-concept-empty {
  display: grid;
  min-width: 0;
  min-height: 74px;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  border: 1px dashed var(--border-strong);
  border-radius: var(--ux-control-radius, 12px);
  background: var(--surface-subtle, rgba(15, 23, 42, 0.025));
  padding: 10px 12px;
}

.recurring-dues-concept-empty > div {
  display: grid;
  min-width: 0;
  gap: 3px;
}

.recurring-dues-concept-empty strong {
  color: var(--text-primary);
  font-size: 0.875rem;
}

.recurring-dues-concept-empty span {
  color: var(--text-secondary);
  font-size: 0.8rem;
  line-height: 1.35;
}
'''
          if marker not in css:
              raise SystemExit('recurring dues CSS marker not found')
          css = css.replace(marker, addition, 1)
          mobile_marker = '''  .recurring-dues-unit-picker small {
    grid-column: 2;
  }
}'''
          mobile_replacement = '''  .recurring-dues-unit-picker small {
    grid-column: 2;
  }

  .recurring-dues-concept-empty {
    grid-template-columns: 1fr;
  }

  .recurring-dues-concept-empty .button {
    width: 100%;
  }
}'''
          if mobile_marker not in css:
              raise SystemExit('recurring dues mobile marker not found')
          css_path.write_text(css.replace(mobile_marker, mobile_replacement, 1))

          test_path = Path('apps/web/src/recurring-dues-workspace.test.ts')
          test = test_path.read_text()
          anchor = '''  it('uses the shared premium form contract for scope and plan drawers', () => {
    expect(workspaceSource).toContain('className="recurring-dues-form ux-form"');
    expect(workspaceSource).toContain('<FormGrid>');
    expect(workspaceSource).toContain('<FormGrid columns={3}>');
    expect(workspaceSource).toContain('<FormActions sticky>');
    expect(workspaceCss).not.toContain('recurring-dues-form-grid');
    expect(workspaceCss).not.toContain('recurring-dues-drawer-footer');
  });
'''
          replacement = '''  it('uses the shared premium form contract for scope and plan drawers', () => {
    expect(workspaceSource).toContain('className="recurring-dues-form ux-form"');
    expect(workspaceSource).toContain('<FormSection');
    expect(workspaceSource).toContain('title="Definición"');
    expect(workspaceSource).toContain('title="Reparto y monto"');
    expect(workspaceSource).toContain('title="Calendario"');
    expect(workspaceSource).toContain('<FormGrid>');
    expect(workspaceSource).toContain('<FormGrid columns={3}>');
    expect(workspaceSource).toContain('<FormActions sticky>');
    expect(workspaceCss).not.toContain('recurring-dues-form-grid');
    expect(workspaceCss).not.toContain('recurring-dues-drawer-footer');
  });

  it('keeps concept creation inside the recurring dues workflow', () => {
    expect(workspaceSource).toContain('onCreateConcept: () => void');
    expect(pageSource).toContain("onCreateConcept={() => openDrawer('concept')}");
    expect(workspaceSource).toContain('No hay conceptos de cobro activos.');
    expect(workspaceSource).toContain('Crear primer concepto');
    expect(workspaceSource).toContain('Nuevo concepto');
    expect(workspaceSource).toContain('activeConcepts.some((concept) => concept.id === current.conceptId)');
    expect(workspaceSource).toContain("item.category === 'regular_dues'");
    expect(workspaceSource).toContain("'Crear y programar'");
  });
'''
          if anchor not in test:
              raise SystemExit('recurring dues test anchor not found')
          test_path.write_text(test.replace(anchor, replacement, 1))
          PY
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/web/src/features/receivables/RecurringDuesWorkspace.tsx
          apps/web/src/pages/ReceivablesPage.tsx
          apps/web/src/recurring-dues.css
          apps/web/src/recurring-dues-workspace.test.ts
      - name: Verify patch
        run: |
          pnpm --filter @habitta/web typecheck
          pnpm --filter @habitta/web test -- recurring-dues-workspace.test.ts
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/receivables/RecurringDuesWorkspace.tsx apps/web/src/pages/ReceivablesPage.tsx apps/web/src/recurring-dues.css apps/web/src/recurring-dues-workspace.test.ts
          git commit -m 'fix: make recurring dues concept flow self-contained'
          git push origin HEAD:hab-332-recurring-dues-concept-ux
