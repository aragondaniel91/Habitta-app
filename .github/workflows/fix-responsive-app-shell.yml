name: Fix Responsive App Shell

on:
  push:
    branches:
      - fix/responsive-app-shell-audit

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/responsive-app-shell-audit
          fetch-depth: 0

      - name: Apply responsive layout corrections
        env:
          PATCH_SCRIPT: 
        run: |
          printf '%s' "$PATCH_SCRIPT" | base64 --decode > /tmp/fix-responsive.py
          python /tmp/fix-responsive.py

      - name: Format and validate
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/web/src/styles.css apps/web/src/expenses.css apps/web/src/governance.css
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          git diff --check

      - name: Commit responsive fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/styles.css apps/web/src/expenses.css apps/web/src/governance.css
          git commit -m "Fix responsive application shell and operations layouts"
          git push origin HEAD:fix/responsive-app-shell-audit
