name: Fix PR 54 Visual Review

on:
  push:
    branches:
      - agent/expenses-governance-foundation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expenses-governance-foundation
          fetch-depth: 0

      - name: Repair temporary visual review workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr54-visual-review.yml')
          text = path.read_text()
          replacements = {
              "cat > /tmp/capture.mjs <<'JS'": "cat > capture.mjs <<'JS'",
              "node /tmp/capture.mjs": "node capture.mjs",
              "category: 'security'": "category: 'maintenance'",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Unexpected occurrence count for {old!r}: {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr54-visual-review.yml
          git commit -m "Fix temporary PR 54 visual review workflow"
          git push origin HEAD:agent/expenses-governance-foundation
