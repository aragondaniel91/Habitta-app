name: HAB-484 branch normalization

on:
  push:
    branches:
      - hab-484-platform-customer-provisioning
    paths:
      - .github/workflows/hab484-patch-temp.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hab-484-platform-customer-provisioning
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic branch patches
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}')
              p.write_text(text.replace(old, new))

          replace(
              '.github/workflows/production-release.yml',
              '      CORS_ALLOWED_ORIGINS: https://app.mihabitta.com\n',
              '      CORS_ALLOWED_ORIGINS: https://app.mihabitta.com,https://admin.mihabitta.com\n',
          )
          replace(
              'apps/api/wrangler.jsonc',
              '        "APP_BASE_URL": "https://app.mihabitta.com",\n        "CORS_ALLOWED_ORIGINS": "https://app.mihabitta.com",\n',
              '        "APP_BASE_URL": "https://app.mihabitta.com",\n        "CORS_ALLOWED_ORIGINS": "https://app.mihabitta.com,https://admin.mihabitta.com",\n',
          )

          for path in [
              'apps/platform-admin/index.html',
              'apps/platform-admin/commercial.html',
              'apps/platform-admin/subscriptions.html',
          ]:
              replace(
                  path,
                  'href="/customers.html">Clientes</a>\n',
                  'href="/customers.html">Clientes</a>\n          <a data-icon="customers" href="/onboarding.html">Onboarding</a>\n',
              )

          api = Path('apps/api/src/customer-invitation-routes.ts')
          text = api.read_text()
          text = text.replace("import { Hono } from 'hono';\n", "import { Hono } from 'hono';\nimport type { Context } from 'hono';\n", 1)
          pattern = re.compile(r"const rpc = async[\s\S]*?\n\n/\*\n \* Platform onboarding queue")
          replacement = """type CustomerInvitationContext = Context<AppEnvironment>;

const rpcRequest = (
  c: CustomerInvitationContext,
  name: string,
  body: unknown = {},
) =>
  fetch(`${c.env.SUPABASE_URL}/rest/v1/rpc/${name}`, {
    method: 'POST',
    headers: {
      apikey: c.env.SUPABASE_ANON_KEY,
      Authorization: `Bearer ${c.get('token')}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });

/*
 * Platform onboarding queue"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('customer-invitation-routes.ts helper block was not found exactly once')
          api.write_text(text)

          replace(
              'supabase/tests/hab484_customer_provisioning.sql',
              'select plan(20);',
              'select plan(24);',
          )
          PY
      - name: Format changed source files
        run: |
          pnpm exec prettier --write \
            .github/workflows/production-release.yml \
            apps/api/wrangler.jsonc \
            apps/api/src/customer-invitation-routes.ts \
            apps/web/src/main.tsx \
            apps/web/src/lib/customerInvitation.ts \
            apps/web/src/components/CustomerInvitationExperience.tsx \
            apps/platform-admin/index.html \
            apps/platform-admin/customers.html \
            apps/platform-admin/commercial.html \
            apps/platform-admin/subscriptions.html \
            apps/platform-admin/onboarding.html \
            apps/platform-admin/onboarding.js \
            apps/platform-admin/onboarding.css \
            scripts/release/validate-production-release.mjs
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/hab484-patch-temp.yml
          git diff --check
          git config user.name habitta-ci
          git config user.email habitta-ci@users.noreply.github.com
          git add -A
          git commit -m "chore(HAB-484): normalize provisioning slice"
          git push origin HEAD:hab-484-platform-customer-provisioning
