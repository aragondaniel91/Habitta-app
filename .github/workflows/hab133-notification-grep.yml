name: HAB-133 Notification Grep

on:
  push:
    branches:
      - agent/hab-133-maintenance-notifications

jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate notification enum conversions and expanders
        run: |
          set -euo pipefail
          grep -RIn -C 8 "notification_type_from_event\|expand_notification_event\|preference_type\|create type public.notification_type\|alter table public.notification_preferences.*notification_type" supabase/migrations supabase/tests || true
