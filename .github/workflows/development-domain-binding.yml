name: Development Domain Binding

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/development-domain-binding.yml'
      - 'config/environments.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-domain-binding
  cancel-in-progress: false

jobs:
  ensure-preview-domain:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      CLOUDFLARE_ZONE_NAME: mihabitta.com
      CLOUDFLARE_PAGES_PROJECT_NAME: habitta-web-dev
      CLOUDFLARE_PAGES_PRODUCTION_BRANCH: development
      CLOUDFLARE_PAGES_PREVIEW_DOMAIN: preview.mihabitta.com
      CLOUDFLARE_PAGES_DNS_TARGET: habitta-web-dev.pages.dev
    steps:
      - name: Validate credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          if { [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -z "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; } || \
             { [ -z "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; }; then
            echo "::error::Cloudflare Access service-token credentials are incomplete. Configure both CLOUDFLARE_ACCESS_CLIENT_ID and CLOUDFLARE_ACCESS_CLIENT_SECRET, or neither."
            exit 1
          fi

      - name: Ensure Pages project and preview domain
        run: |
          set -euo pipefail

          account_api() {
            local method="$1"
            local path="$2"
            local body="${3:-}"
            local args=(
              -fsS
              -X "$method"
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
              -H 'Content-Type: application/json'
            )
            if [ -n "$body" ]; then
              args+=(--data "$body")
            fi
            curl "${args[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$path"
          }

          PROJECT_PATH="pages/projects/$CLOUDFLARE_PAGES_PROJECT_NAME"
          PROJECT_JSON=$(account_api GET "$PROJECT_PATH")
          printf '%s' "$PROJECT_JSON" | jq -e '.success == true' >/dev/null

          CURRENT_BRANCH=$(printf '%s' "$PROJECT_JSON" | jq -r '.result.production_branch // empty')
          if [ "$CURRENT_BRANCH" != "$CLOUDFLARE_PAGES_PRODUCTION_BRANCH" ]; then
            UPDATED_JSON=$(account_api PATCH "$PROJECT_PATH" "$(jq -cn --arg branch "$CLOUDFLARE_PAGES_PRODUCTION_BRANCH" '{production_branch:$branch}')")
            printf '%s' "$UPDATED_JSON" | jq -e --arg branch "$CLOUDFLARE_PAGES_PRODUCTION_BRANCH" '.success == true and .result.production_branch == $branch' >/dev/null
            echo "Updated Pages production branch to $CLOUDFLARE_PAGES_PRODUCTION_BRANCH"
          else
            echo "Pages production branch already set to $CLOUDFLARE_PAGES_PRODUCTION_BRANCH"
          fi

          DOMAINS_PATH="$PROJECT_PATH/domains"
          DOMAINS_JSON=$(account_api GET "$DOMAINS_PATH")
          printf '%s' "$DOMAINS_JSON" | jq -e '.success == true' >/dev/null

          if printf '%s' "$DOMAINS_JSON" | jq -e --arg domain "$CLOUDFLARE_PAGES_PREVIEW_DOMAIN" '.result[]? | select(.name == $domain)' >/dev/null; then
            echo "Preview domain is already attached: $CLOUDFLARE_PAGES_PREVIEW_DOMAIN"
          else
            CREATE_JSON=$(account_api POST "$DOMAINS_PATH" "$(jq -cn --arg name "$CLOUDFLARE_PAGES_PREVIEW_DOMAIN" '{name:$name}')")
            printf '%s' "$CREATE_JSON" | jq -e '.success == true' >/dev/null
            echo "Attached preview domain: $CLOUDFLARE_PAGES_PREVIEW_DOMAIN"
          fi

      - name: Ensure preview DNS CNAME points to Pages
        run: |
          set -euo pipefail

          cf_api() {
            local method="$1"
            local path="$2"
            local body="${3:-}"
            local args=(
              -fsS
              -X "$method"
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
              -H 'Content-Type: application/json'
            )
            if [ -n "$body" ]; then
              args+=(--data "$body")
            fi
            curl "${args[@]}" "https://api.cloudflare.com/client/v4/$path"
          }

          ZONES_JSON=$(cf_api GET "zones?name=$CLOUDFLARE_ZONE_NAME&account.id=$CLOUDFLARE_ACCOUNT_ID")
          printf '%s' "$ZONES_JSON" | jq -e '.success == true' >/dev/null
          ZONE_ID=$(printf '%s' "$ZONES_JSON" | jq -r --arg zone "$CLOUDFLARE_ZONE_NAME" '[.result[]? | select(.name == $zone)] | if length == 1 then .[0].id else empty end')
          test -n "$ZONE_ID"

          RECORDS_JSON=$(cf_api GET "zones/$ZONE_ID/dns_records?name=$CLOUDFLARE_PAGES_PREVIEW_DOMAIN")
          printf '%s' "$RECORDS_JSON" | jq -e '.success == true' >/dev/null
          RECORD_COUNT=$(printf '%s' "$RECORDS_JSON" | jq '.result | length')

          if [ "$RECORD_COUNT" -eq 0 ]; then
            CREATE_JSON=$(cf_api POST "zones/$ZONE_ID/dns_records" "$(jq -cn \
              --arg type CNAME \
              --arg name "$CLOUDFLARE_PAGES_PREVIEW_DOMAIN" \
              --arg content "$CLOUDFLARE_PAGES_DNS_TARGET" \
              '{type:$type,name:$name,content:$content,ttl:1,proxied:true}')")
            printf '%s' "$CREATE_JSON" | jq -e '.success == true' >/dev/null
            echo "Created DNS CNAME: $CLOUDFLARE_PAGES_PREVIEW_DOMAIN -> $CLOUDFLARE_PAGES_DNS_TARGET"
          elif [ "$RECORD_COUNT" -eq 1 ]; then
            RECORD_ID=$(printf '%s' "$RECORDS_JSON" | jq -r '.result[0].id')
            RECORD_TYPE=$(printf '%s' "$RECORDS_JSON" | jq -r '.result[0].type')
            RECORD_CONTENT=$(printf '%s' "$RECORDS_JSON" | jq -r '.result[0].content')
            RECORD_PROXIED=$(printf '%s' "$RECORDS_JSON" | jq -r '.result[0].proxied // false')

            if [ "$RECORD_TYPE" = CNAME ] && [ "$RECORD_CONTENT" = "$CLOUDFLARE_PAGES_DNS_TARGET" ] && [ "$RECORD_PROXIED" = true ]; then
              echo "DNS CNAME already correct: $CLOUDFLARE_PAGES_PREVIEW_DOMAIN -> $CLOUDFLARE_PAGES_DNS_TARGET"
            else
              UPDATE_JSON=$(cf_api PUT "zones/$ZONE_ID/dns_records/$RECORD_ID" "$(jq -cn \
                --arg type CNAME \
                --arg name "$CLOUDFLARE_PAGES_PREVIEW_DOMAIN" \
                --arg content "$CLOUDFLARE_PAGES_DNS_TARGET" \
                '{type:$type,name:$name,content:$content,ttl:1,proxied:true}')")
              printf '%s' "$UPDATE_JSON" | jq -e '.success == true' >/dev/null
              echo "Corrected DNS CNAME: $CLOUDFLARE_PAGES_PREVIEW_DOMAIN -> $CLOUDFLARE_PAGES_DNS_TARGET"
            fi
          else
            echo "::error::Multiple DNS records exist for $CLOUDFLARE_PAGES_PREVIEW_DOMAIN; refusing to modify an ambiguous DNS state."
            exit 1
          fi

      - name: Wait for preview domain to become active
        run: |
          set -euo pipefail
          DOMAIN_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT_NAME/domains/$CLOUDFLARE_PAGES_PREVIEW_DOMAIN"

          for attempt in $(seq 1 30); do
            RESPONSE=$(curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              "$DOMAIN_URL")
            printf '%s' "$RESPONSE" | jq -e '.success == true' >/dev/null
            STATUS=$(printf '%s' "$RESPONSE" | jq -r '.result.status // empty')
            echo "Preview domain status attempt $attempt/30: ${STATUS:-unknown}"
            if [ "$STATUS" = active ]; then
              exit 0
            fi
            sleep 10
          done

          echo "::error::Cloudflare Pages did not report $CLOUDFLARE_PAGES_PREVIEW_DOMAIN active within 5 minutes."
          exit 1

      - name: Verify preview domain serves HTTPS
        run: |
          set -euo pipefail
          PREVIEW_URL="https://$CLOUDFLARE_PAGES_PREVIEW_DOMAIN"
          ACCESS_HEADERS=()

          if [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ] && [ -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; then
            ACCESS_HEADERS+=(
              -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID"
              -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET"
            )
            echo "Preview health check will authenticate with a Cloudflare Access service token."
          else
            echo "No Cloudflare Access service token is configured for the preview health check."
          fi

          LAST_STATUS=""
          for attempt in $(seq 1 30); do
            STATUS=$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 5 \
              --max-time 15 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "${ACCESS_HEADERS[@]}" \
              "$PREVIEW_URL" || true)
            LAST_STATUS="$STATUS"

            echo "Preview HTTPS attempt $attempt/30: ${STATUS:-unreachable}"
            case "$STATUS" in
              2??|3??) exit 0 ;;
            esac
            sleep 10
          done

          if [ "$LAST_STATUS" = "403" ]; then
            if [ -z "$CLOUDFLARE_ACCESS_CLIENT_ID" ]; then
              echo "::error::$PREVIEW_URL is reachable but returned HTTP 403 for all attempts. If the preview domain is intentionally protected by Cloudflare Access, create a service token for this application and store its credentials as CLOUDFLARE_ACCESS_CLIENT_ID and CLOUDFLARE_ACCESS_CLIENT_SECRET GitHub secrets. If Access is not intentional, inspect Access/WAF/security rules for the custom domain."
            else
              echo "::error::$PREVIEW_URL returned HTTP 403 even with the configured Cloudflare Access service token. Verify the token is allowed by the Access application/policy for this exact custom domain and inspect WAF/security rules."
            fi
          else
            echo "::error::Pages is attached and DNS is canonical, but $PREVIEW_URL did not serve a successful HTTPS response within 5 minutes. Last HTTP status: ${LAST_STATUS:-unreachable}."
          fi
          exit 1
