name: Record Visual Review Run

on:
  push:
    branches:
      - feat/password-auth-admin-onboarding
    paths:
      - '.github/workflows/record-visual-review-run.yml'

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/password-auth-admin-onboarding

      - name: Wait for visual review workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..60}; do
            result=$(gh run list \
              --workflow visual-review-auth-onboarding.yml \
              --branch feat/password-auth-admin-onboarding \
              --limit 1 \
              --json databaseId,status,conclusion \
              --jq '.[0] // empty')
            if [ -n "$result" ]; then
              status=$(printf '%s' "$result" | jq -r '.status')
              if [ "$status" = "completed" ]; then
                printf '%s\n' "$result" > visual-review-result.json
                break
              fi
            fi
            sleep 10
          done

          if [ ! -f visual-review-result.json ]; then
            echo 'Visual review run did not complete within the workflow window.' >&2
            exit 1
          fi

      - name: Commit visual review result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-review-result.json
          git commit -m "Record responsive visual review result"
          git push origin HEAD:feat/password-auth-admin-onboarding
