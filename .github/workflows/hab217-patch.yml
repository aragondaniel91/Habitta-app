name: HAB-217 Wire People Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.head_ref == 'feat/hab-217-private-person-notes' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hab-217-private-person-notes
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/hab217_patch_people.py
      - run: pnpm format
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/people/PeoplePanel.tsx apps/web/src/people-workspace.test.ts
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "feat(hab217): surface private notes in People"
          git push origin HEAD:feat/hab-217-private-person-notes
