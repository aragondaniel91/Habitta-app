name: HAB-217 one-shot People patch

on:
  push:
    branches:
      - feat/hab-217-private-person-notes
    paths:
      - .github/workflows/hab217-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hab-217-private-person-notes
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/hab217_patch_people.py
      - run: pnpm exec prettier --write apps/web/src/features/people/PeoplePanel.tsx apps/web/src/people-workspace.test.ts
      - name: Commit patched People workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/people/PeoplePanel.tsx apps/web/src/people-workspace.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(hab217): surface private notes in People"
          git push origin HEAD:feat/hab-217-private-person-notes

# one-shot retrigger after PR creation
