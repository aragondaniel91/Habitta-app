name: Fix announcements foundation

on:
  push:
    branches:
      - feat/backend-announcements-foundation
    paths:
      - scripts/fix-announcements-foundation.py
      - .github/workflows/fix-announcements-foundation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply corrections
        run: |
          # This workflow removes itself after applying the product correction.
          python scripts/fix-announcements-foundation.py
          rm -f scripts/fix-announcements-foundation.py
          rm -f .github/workflows/fix-announcements-foundation.yml
          pnpm format
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix announcement notification scope and validation"
          git push origin HEAD:${{ github.ref_name }}
