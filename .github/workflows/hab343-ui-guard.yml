name: HAB343 UI Guard

on:
  push:
    branches:
      - hab-343-resident-receivables-view
    paths:
      - .github/workflows/hab343-ui-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hab-343-resident-receivables-view
      - name: Hide recurring administration from non-managers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/features/receivables/RecurringDuesWorkspace.tsx')
          text = path.read_text()
          old = '  return (\n    <Surface className="recurring-dues-workspace">'
          new = '  if (!canManage) return null;\n\n  return (\n    <Surface className="recurring-dues-workspace">'
          if text.count(old) != 1:
              raise SystemExit(f'expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/features/receivables/RecurringDuesWorkspace.tsx
          git diff --cached --check
          git commit -m "fix HAB-343 hide recurring admin workspace for residents"
          git push origin HEAD:hab-343-resident-receivables-view
