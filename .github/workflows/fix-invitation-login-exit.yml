name: Fix Invitation Login Exit

on:
  push:
    branches:
      - fix/invitation-login-exit

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/invitation-login-exit
          fetch-depth: 0
      - name: Add a safe exit from invitation authentication
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/components/AdminInvitationExperience.tsx')
          text = path.read_text()

          if 'Entrar con otro correo' in text:
              print('Fix already present')
              raise SystemExit(0)

          lines = text.splitlines()

          confirmation_index = next(
              index
              for index, line in enumerate(lines)
              if 'Después de confirmar, vuelve a este enlace para terminar.' in line
          )
          confirmation_button = [
              '                  <Button',
              '                    onClick={() => {',
              "                      window.location.href = '/';",
              '                    }}',
              '                    type="button"',
              '                    variant="ghost"',
              '                  >',
              '                    Ir al inicio de sesión',
              '                  </Button>',
          ]
          lines[confirmation_index + 1:confirmation_index + 1] = confirmation_button

          register_button_index = next(
              index
              for index, line in enumerate(lines)
              if "Crear cuenta y continuar" in line
          )
          register_form_end = next(
              index
              for index in range(register_button_index, len(lines))
              if lines[index].strip() == '</form>'
          )
          conditional_end = register_form_end + 1
          if lines[conditional_end].strip() != ')}':
              raise SystemExit('Registration conditional marker not found')

          exit_block = [
              '',
              '                  <div className="access-card__actions">',
              '                    <Button',
              '                      onClick={() => {',
              "                        window.location.href = '/';",
              '                      }}',
              '                      type="button"',
              '                      variant="ghost"',
              '                    >',
              '                      Entrar con otro correo',
              '                    </Button>',
              '                  </div>',
              '                  <p className="access-card__fine-print">',
              '                    El correo mostrado está protegido porque esta invitación pertenece únicamente a',
              '                    esa dirección. Para usar otra cuenta, vuelve al inicio de sesión.',
              '                  </p>',
          ]
          lines[conditional_end + 1:conditional_end + 1] = exit_block
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/AdminInvitationExperience.tsx
          git commit -m "Add exit from invitation login"
          git push origin HEAD:fix/invitation-login-exit
