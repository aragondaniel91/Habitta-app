name: Production Database Backup

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: kgsfaahixbcwcmykmhat
  BACKUP_BUCKET: habitta-database-backups-prod

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.114.0
          github-token: ${{ github.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify backup prerequisites
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD BACKUP_ENCRYPTION_PASSPHRASE CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "Missing required production secret: $name" >&2; exit 1; }
          done

      - name: Create production logical backup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .backup/plain .backup/out
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          # The standard Supabase dump intentionally excludes managed schemas such as auth.
          # Keep the portable public/application backup and add an explicit auth data dump so
          # recovery evidence includes users and their related Auth rows without copying auth DDL.
          supabase db dump --linked --role-only -f .backup/plain/roles.sql
          supabase db dump --linked -f .backup/plain/schema.sql
          supabase db dump --linked --data-only --use-copy \
            -x 'storage.buckets_vectors' \
            -x 'storage.vector_indexes' \
            -f .backup/plain/data.sql
          supabase db dump --linked --schema auth --data-only --use-copy \
            -x 'auth.schema_migrations' \
            -f .backup/plain/auth-data.sql

          # Link writes a pooler URL with a password placeholder. Use PGPASSWORD so the database
          # password never appears in a command line, artifact or log. The metrics contain counts
          # only; no user IDs, emails, names, tokens, amounts or document contents are persisted.
          test -s supabase/.temp/pooler-url
          POOLER_URL="$(sed 's/:\[YOUR-PASSWORD\]@/@/' supabase/.temp/pooler-url)"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$POOLER_URL" -X -qAt -v ON_ERROR_STOP=1 <<'SQL' > .backup/plain/source-metrics.tsv
          select 'auth_users' || E'\t' || count(*) from auth.users;
          select 'payments' || E'\t' || count(*) from public.payments;
          select 'payment_allocations' || E'\t' || count(*) from public.payment_allocations;
          select 'payment_receipts' || E'\t' || count(*) from public.payment_receipts;
          select 'receivable_items' || E'\t' || count(*) from public.receivable_items;
          select 'receivable_ledger_entries' || E'\t' || count(*) from public.receivable_ledger_entries;
          SQL

          test -s .backup/plain/auth-data.sql
          test -s .backup/plain/source-metrics.tsv
          AUTH_USERS_COUNT="$(awk -F '\t' '$1 == "auth_users" { print $2 }' .backup/plain/source-metrics.tsv)"
          [[ "$AUTH_USERS_COUNT" =~ ^[0-9]+$ ]]

          printf '%s\n' "$GITHUB_SHA" > .backup/plain/source-commit.txt
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .backup/plain/created-at.txt
          (cd .backup/plain && sha256sum roles.sql schema.sql data.sql auth-data.sql source-metrics.tsv source-commit.txt created-at.txt > manifest.sha256)
          tar -C .backup/plain -czf .backup/database-backup.tar.gz .

      - name: Encrypt backup before upload
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          BACKUP_ID="$(date -u +'%Y%m%dT%H%M%SZ')-${GITHUB_SHA::12}"
          echo "BACKUP_ID=$BACKUP_ID" >> "$GITHUB_ENV"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE \
            -in .backup/database-backup.tar.gz \
            -out ".backup/out/${BACKUP_ID}.tar.gz.enc"
          sha256sum ".backup/out/${BACKUP_ID}.tar.gz.enc" > ".backup/out/${BACKUP_ID}.sha256"
          rm -rf .backup/plain .backup/database-backup.tar.gz

      - name: Upload encrypted backup to private R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          OBJECT_PREFIX="daily/$(date -u +'%Y/%m/%d')"
          BACKUP_FILE="$GITHUB_WORKSPACE/.backup/out/${BACKUP_ID}.tar.gz.enc"
          CHECKSUM_FILE="$GITHUB_WORKSPACE/.backup/out/${BACKUP_ID}.sha256"
          test -s "$BACKUP_FILE"
          test -s "$CHECKSUM_FILE"
          pnpm --filter @habitta/api exec wrangler r2 object put \
            "$BACKUP_BUCKET/$OBJECT_PREFIX/${BACKUP_ID}.tar.gz.enc" \
            --file "$BACKUP_FILE" --remote
          pnpm --filter @habitta/api exec wrangler r2 object put \
            "$BACKUP_BUCKET/$OBJECT_PREFIX/${BACKUP_ID}.sha256" \
            --file "$CHECKSUM_FILE" --remote
          echo "Encrypted backup stored as $OBJECT_PREFIX/${BACKUP_ID}.tar.gz.enc"

      - name: Remove local backup material
        if: always()
        run: rm -rf .backup
