name: HAB-133 Typecheck Fix

on:
  push:
    branches:
      - agent/hab-133-maintenance-financial-workspace

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hab-133-maintenance-financial-workspace
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply focused fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/features/maintenance/MaintenanceFinancialWorkspace.tsx')
          source = path.read_text()
          source = source.replace(
              '        <EmptyState\n          description="Crea una orden de trabajo en Operaciones para empezar a registrar cotizaciones y evidencias."',
              '        <EmptyState\n          icon={<span aria-hidden="true">🛠</span>}\n          description="Crea una orden de trabajo en Operaciones para empezar a registrar cotizaciones y evidencias."',
          )
          source = source.replace(
              '              quoteId={attachmentQuoteId || undefined}\n              session={session}',
              '              {...(attachmentQuoteId ? { quoteId: attachmentQuoteId } : {})}\n              session={session}',
          )
          path.write_text(source)
          PY
          pnpm exec prettier --write apps/web/src/features/maintenance/MaintenanceFinancialWorkspace.tsx
      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/maintenance/MaintenanceFinancialWorkspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m "HAB-133 fix financial workspace types"
          git push origin HEAD:agent/hab-133-maintenance-financial-workspace
