name: Apply Expenses Governance Foundation

on:
  push:
    branches:
      - agent/expenses-governance-foundation
    paths:
      - '.github/workflows/apply-expenses-governance.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expenses-governance-foundation
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply reviewed module implementation
        run: python scripts/agent/apply-expenses-governance.py

      - name: Remove temporary delivery files
        run: |
          rm -f scripts/agent/apply-expenses-governance.py
          rm -f .github/workflows/apply-expenses-governance.yml

      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add expenses and community governance modules"
          git push origin HEAD:agent/expenses-governance-foundation
