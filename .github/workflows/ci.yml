name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent financial E2E diagnostic artifact exposure
        shell: bash
        run: |
          set -euo pipefail
          # Financial E2E runs authenticated tests. Never add an artifact
          # uploader here without separate security assessment of its scope.
          test -f .github/workflows/financial-e2e.yml || {
            echo 'Missing financial E2E workflow; artifact guard fails closed.' >&2
            exit 1
          }
          # Catch both "- uses:" and "uses:", quoted/unquoted and case variants.
          if grep -Eiq '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*.*upload-artifact' .github/workflows/financial-e2e.yml; then
            echo 'Financial E2E must not upload authenticated traces or debug logs as artifacts.' >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with: { version: 10.12.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm notifications:config:check
      - name: Check formatting
        run: |
          pnpm format:check || {
            pnpm exec prettier --list-different . > prettier-files.txt
            exit 1
          }
      - name: Prepare formatting diagnostics
        if: failure()
        run: |
          pnpm format
          mkdir -p formatted-files
          xargs -a prettier-files.txt cp --parents --target-directory=formatted-files
      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-diagnostics
          path: |
            prettier-files.txt
            formatted-files
          if-no-files-found: ignore
      - run: pnpm release:dev:validate
      - name: Verify development cannot reach production credentials or database
        run: pnpm release:isolation:test
      - name: Verify read-only production preflight safety rules
        run: pnpm release:pilot:preflight:test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: git diff --check
      - run: git diff --check
