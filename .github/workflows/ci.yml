name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-stacked-requests-ui:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/frontend-service-requests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frontend-service-requests
          fetch-depth: 0
      - name: Apply strict result narrowing and restore head workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/pages/RequestsPage.tsx')
          value = path.read_text()
          old = """    if (requests.status === 'rejected' || categories.status === 'rejected') {
      const reason = requests.status === 'rejected' ? requests.reason : categories.reason;
      setError(
        reason instanceof Error ? reason.message : 'No se pudo cargar el espacio de solicitudes.',
      );
      setLoading(false);
      return;
    }
"""
          new = """    if (requests.status === 'rejected') {
      setError(
        requests.reason instanceof Error
          ? requests.reason.message
          : 'No se pudo cargar el espacio de solicitudes.',
      );
      setLoading(false);
      return;
    }
    if (categories.status === 'rejected') {
      setError(
        categories.reason instanceof Error
          ? categories.reason.message
          : 'No se pudo cargar el espacio de solicitudes.',
      );
      setLoading(false);
      return;
    }
"""
          if old not in value:
              raise SystemExit('loader block not found')
          path.write_text(value.replace(old, new))
          PY
          rm -f .github/workflows/fix-requests-loader-narrowing.yml
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit correction to stacked head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Narrow requests loader failures explicitly"
          git push origin HEAD:feat/frontend-service-requests

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.12.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm notifications:config:check
      - name: Check formatting
        run: |
          pnpm format:check || {
            pnpm exec prettier --list-different . > prettier-files.txt
            exit 1
          }
      - name: Prepare formatting diagnostics
        if: failure()
        run: |
          pnpm format
          mkdir -p formatted-files
          xargs -a prettier-files.txt cp --parents --target-directory=formatted-files
      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-diagnostics
          path: |
            prettier-files.txt
            formatted-files
          if-no-files-found: ignore
      - run: pnpm release:dev:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: git diff --check
      - run: git diff --check
