name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.12.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm notifications:config:check
      - name: Check formatting
        run: |
          pnpm format:check || {
            pnpm exec prettier --list-different . > prettier-files.txt
            exit 1
          }
      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-files
          path: prettier-files.txt
          if-no-files-found: ignore
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
