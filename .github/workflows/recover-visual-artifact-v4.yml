name: Recover Visual Artifact V4

on:
  push:
    branches:
      - feat/password-auth-admin-onboarding
    paths:
      - '.github/workflows/recover-visual-artifact-v4.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/password-auth-admin-onboarding

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm add -Dw @playwright/test@1.54.2 --ignore-workspace-root-check
      - run: pnpm exec playwright install --with-deps chromium
      - run: python -m pip install pillow

      - name: Build visual frontend
        env:
          VITE_APP_ENV: development
          VITE_API_BASE_URL: http://127.0.0.1:8787
          VITE_SUPABASE_URL: https://visual.supabase.co
          VITE_SUPABASE_ANON_KEY: visual-anon-key
        run: pnpm --filter @habitta/web build

      - name: Start preview
        run: |
          nohup pnpm --filter @habitta/web exec vite preview --host 127.0.0.1 --port 4173 > /tmp/habitta-vite.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/habitta-vite.log
          exit 1

      - name: Extract and correct visual test
        run: |
          awk '
            /cat > visual-review.spec.ts <<'\''EOF'\''/ { capture=1; next }
            capture && /^[[:space:]]*EOF$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/recover-visual-screenshots.yml > visual-review.spec.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('visual-review.spec.ts')
          text = path.read_text()
          replacements = {
              "await page.getByLabel('Ciudad').fill('Caracas');":
                  "await page.getByRole('textbox', { name: 'Ciudad', exact: true }).fill('Caracas');",
              "await expect(page.getByRole('heading', { name: 'Equipo y accesos', exact: true })).toBeVisible();":
                  "await expect(page.locator('h2').filter({ hasText: 'Equipo y accesos' }).first()).toBeVisible();",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected selector was not found: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Capture 13 responsive screenshots
        run: pnpm exec playwright test visual-review.spec.ts --reporter=line

      - name: Build contact sheet and ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          files = sorted(Path('visual-screenshots').glob('*.png'))
          if len(files) != 13:
              raise SystemExit(f'Expected 13 screenshots, found {len(files)}')
          width = 640
          gap = 18
          font = ImageFont.load_default()
          cards = []
          for file in files:
              image = Image.open(file).convert('RGB')
              ratio = width / image.width
              thumb = image.resize((width, max(1, int(image.height * ratio))))
              card = Image.new('RGB', (width, thumb.height + 34), 'white')
              card.paste(thumb, (0, 34))
              ImageDraw.Draw(card).text((10, 10), file.stem, fill='black', font=font)
              cards.append(card)
          rows = (len(cards) + 1) // 2
          heights = [max(c.height for c in cards[r*2:(r+1)*2]) for r in range(rows)]
          sheet = Image.new('RGB', (2 * width + 3 * gap, sum(heights) + (rows + 1) * gap), '#eef1f5')
          y = gap
          for row in range(rows):
              x = gap
              for card in cards[row*2:(row+1)*2]:
                  sheet.paste(card, (x, y))
                  x += width + gap
              y += heights[row] + gap
          sheet.save('habitta-responsive-contact-sheet.jpg', quality=82, optimize=True)
          PY
          zip -r habitta-responsive-screenshots.zip visual-screenshots habitta-responsive-contact-sheet.jpg

      - name: Upload verified artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: habitta-responsive-screenshots-v4
          path: |
            visual-screenshots
            habitta-responsive-contact-sheet.jpg
            habitta-responsive-screenshots.zip
          if-no-files-found: error
          retention-days: 7

      - name: Record artifact ID
        run: |
          printf '{"run_id":%s,"artifact_id":%s,"artifact_url":"%s","count":13}\n' \
            '${{ github.run_id }}' \
            '${{ steps.upload.outputs.artifact-id }}' \
            '${{ steps.upload.outputs.artifact-url }}' > visual-artifact-v4.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-artifact-v4.json
          git commit -m "chore: record complete visual artifact v4"
          git push origin HEAD:feat/password-auth-admin-onboarding
