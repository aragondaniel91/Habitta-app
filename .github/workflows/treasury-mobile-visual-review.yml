name: Treasury real mobile visual review

on:
  push:
    branches:
      - feature/treasury-workspace

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/treasury-workspace
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore temporary visual harness from reviewed commit
        run: |
          git show 38da8bfe1891b9761c0d864978b1f873a6adc537:apps/web/treasury-visual-review.html > apps/web/treasury-visual-review.html
          git show 38da8bfe1891b9761c0d864978b1f873a6adc537:apps/web/src/treasury-visual-review.tsx > apps/web/src/treasury-visual-review.tsx
          git show 38da8bfe1891b9761c0d864978b1f873a6adc537:scripts/treasury-visual-capture.mjs > scripts/treasury-visual-capture.mjs
          sed -i 's/{ viewportSize: viewport, deviceScaleFactor: 1 }/{ viewport, deviceScaleFactor: 1 }/' scripts/treasury-visual-capture.mjs
      - run: pnpm install --frozen-lockfile
      - name: Install visual review browser
        run: |
          mkdir -p "$RUNNER_TEMP/treasury-mobile-visual"
          cd "$RUNNER_TEMP/treasury-mobile-visual"
          npm init -y >/dev/null
          npm install playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/scripts/treasury-visual-capture.mjs" capture.mjs
      - name: Start Vite
        run: |
          pnpm --filter @habitta/web dev --host 127.0.0.1 --port 4173 >"$RUNNER_TEMP/treasury-vite.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/treasury-visual-review.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/treasury-vite.log"
          exit 1
      - name: Capture real desktop and mobile views
        env:
          VISUAL_OUTPUT: ${{ github.workspace }}/treasury-real-mobile-review
        run: cd "$RUNNER_TEMP/treasury-mobile-visual" && node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: treasury-real-mobile-review
          path: treasury-real-mobile-review/*.png
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/treasury-mobile-visual-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary Treasury mobile visual review"
          git push origin HEAD:feature/treasury-workspace
