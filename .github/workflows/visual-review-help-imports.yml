name: Visual Review Help Imports

on:
  push:
    branches:
      - feat/help-guided-csv-import

permissions:
  contents: read

jobs:
  visual-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create visual harness
        run: |
          cat > apps/web/visual-help-imports.html <<'HTML'
          <!doctype html>
          <html lang="es">
            <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Habitta visual review</title></head>
            <body><div id="root"></div><script type="module" src="/src/visual-help-imports.tsx"></script></body>
          </html>
          HTML

          cat > apps/web/src/visual-help-imports.tsx <<'TSX'
          import { StrictMode } from 'react';
          import { createRoot } from 'react-dom/client';
          import type { Session } from '@supabase/supabase-js';
          import { AppShell } from './components/AppShell';
          import { Surface } from './components/ui';
          import { APP_ROUTES } from './navigation';
          import './styles.css';
          import './help-imports.css';
          import './brand-palette.css';
          import './brand-assets.css';

          const session = {
            access_token: 'visual-token',
            token_type: 'bearer',
            expires_in: 3600,
            expires_at: Math.floor(Date.now() / 1000) + 3600,
            refresh_token: 'visual-refresh',
            user: {
              id: '11111111-1111-1111-1111-111111111111',
              aud: 'authenticated',
              role: 'authenticated',
              email: 'administracion@mihabitta.com',
              app_metadata: {},
              user_metadata: { full_name: 'Administración Patricia' },
              created_at: new Date().toISOString(),
            },
          } as Session;

          const mockJson = (value: unknown, status = 200) =>
            new Response(JSON.stringify(value), {
              status,
              headers: { 'Content-Type': 'application/json' },
            });

          window.fetch = async (input) => {
            const url = String(input);
            if (url.includes('/imports/units/preview')) {
              return mockJson({ valid: [{ row: 2 }], errors: [], valid_count: 1, error_count: 0 });
            }
            if (url.includes('/notifications')) return mockJson([]);
            return mockJson([]);
          };

          const route = APP_ROUTES.find((item) => item.key === 'units') ?? APP_ROUTES[0];

          function VisualApp() {
            return (
              <AppShell
                condominiums={[{ id: '22222222-2222-2222-2222-222222222222', name: 'Condominio Patricia', organization_id: '33333333-3333-3333-3333-333333333333' }]}
                contextMessage={null}
                currentRoute={route}
                notificationOpen={false}
                onAddCondominium={() => undefined}
                onCloseNotifications={() => undefined}
                onCondominiumChange={() => undefined}
                onNavigate={() => undefined}
                onOpenNotifications={() => undefined}
                onSignOut={() => undefined}
                organizations={[{ id: '33333333-3333-3333-3333-333333333333', name: 'Administración Patricia' }]}
                selectedCondominiumId="22222222-2222-2222-2222-222222222222"
                session={session}
              >
                <div className="page-stack">
                  <Surface className="module-overview">
                    <div>
                      <span className="badge" data-tone="info">Estructura residencial</span>
                      <h2>Unidades registradas</h2>
                      <p>Administra torres, apartamentos, locales, estacionamientos y depósitos.</p>
                    </div>
                  </Surface>
                </div>
              </AppShell>
            );
          }

          createRoot(document.getElementById('root')!).render(<StrictMode><VisualApp /></StrictMode>);
          TSX

      - name: Install browser runner
        run: |
          mkdir -p /tmp/habitta-visual
          npm install --prefix /tmp/habitta-visual playwright@1.54.1
          npx --prefix /tmp/habitta-visual playwright install --with-deps chromium

      - name: Start visual harness
        run: |
          pnpm --filter @habitta/web exec vite --host 127.0.0.1 --port 4173 > /tmp/habitta-vite.log 2>&1 &
          echo $! > /tmp/habitta-vite.pid
          for attempt in $(seq 1 40); do
            curl -fsS http://127.0.0.1:4173/visual-help-imports.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/habitta-vite.log
          exit 1

      - name: Capture desktop and mobile
        run: |
          mkdir -p visual-review
          cat > /tmp/habitta-visual/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });

          const capture = async (viewport, prefix) => {
            const page = await browser.newPage({ viewportSize: viewport, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:4173/visual-help-imports.html', { waitUntil: 'networkidle' });
            await page.screenshot({ path: `visual-review/${prefix}-module.png`, fullPage: true });

            await page.getByRole('button', { name: 'Ayuda', exact: true }).click();
            await page.getByRole('heading', { name: 'Unidades' }).last().waitFor();
            await page.screenshot({ path: `visual-review/${prefix}-help.png`, fullPage: true });
            await page.keyboard.press('Escape');
            await page.getByRole('button', { name: 'Importar datos', exact: true }).waitFor();

            await page.getByRole('button', { name: 'Importar datos', exact: true }).click();
            await page.getByText('Importación guiada').waitFor();
            await page.screenshot({ path: `visual-review/${prefix}-import-empty.png`, fullPage: true });

            const csv = [
              'building_name,unit_code,unit_type,floor,ownership_percentage,status',
              'Torre A,A-101,apartment,1,2.50,active',
            ].join('\n');
            const csvPath = `/tmp/${prefix}-units.csv`;
            await writeFile(csvPath, csv);
            await page.locator('input[type=file]').setInputFiles(csvPath);
            await page.getByRole('button', { name: 'Validar y previsualizar' }).click();
            await page.getByText('Listas para importar').waitFor();
            await page.screenshot({ path: `visual-review/${prefix}-import-preview.png`, fullPage: true });
            await page.close();
          };

          await capture({ width: 1440, height: 900 }, 'desktop');
          await capture({ width: 390, height: 844 }, 'mobile');
          await browser.close();
          JS
          node /tmp/habitta-visual/capture.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: help-imports-visual-review
          path: visual-review/*.png
          retention-days: 7
