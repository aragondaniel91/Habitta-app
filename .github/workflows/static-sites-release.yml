name: Static Sites Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Static surface to deploy
        required: true
        type: choice
        options:
          - site-production
          - admin-production
          - admin-preview
      confirmation:
        description: Type DEPLOY-HABITTA-STATIC
        required: true

permissions:
  contents: read

concurrency:
  group: static-sites-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INPUT_TARGET: ${{ inputs.target }}
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - run: pnpm install --frozen-lockfile

      - name: Validate deployment request
        run: |
          set -euo pipefail
          test "$INPUT_CONFIRMATION" = DEPLOY-HABITTA-STATIC
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Resolve target
        run: |
          set -euo pipefail
          case "$INPUT_TARGET" in
            site-production)
              echo 'DEPLOY_DIR=apps/site' >> "$GITHUB_ENV"
              echo 'PAGES_PROJECT=habitta-site-prod' >> "$GITHUB_ENV"
              echo 'PAGES_BRANCH=main' >> "$GITHUB_ENV"
              echo 'EXPECTED_URL=https://mihabitta.com' >> "$GITHUB_ENV"
              ;;
            admin-production)
              echo 'DEPLOY_DIR=apps/platform-admin' >> "$GITHUB_ENV"
              echo 'PAGES_PROJECT=habitta-admin-prod' >> "$GITHUB_ENV"
              echo 'PAGES_BRANCH=main' >> "$GITHUB_ENV"
              echo 'EXPECTED_URL=https://admin.mihabitta.com' >> "$GITHUB_ENV"
              ;;
            admin-preview)
              echo 'DEPLOY_DIR=apps/platform-admin' >> "$GITHUB_ENV"
              echo 'PAGES_PROJECT=habitta-admin-dev' >> "$GITHUB_ENV"
              echo 'PAGES_BRANCH=development' >> "$GITHUB_ENV"
              echo 'EXPECTED_URL=https://admin-preview.mihabitta.com' >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unknown target: $INPUT_TARGET" >&2
              exit 1
              ;;
          esac

      - name: Validate static surface
        run: |
          set -euo pipefail
          test -f "$DEPLOY_DIR/index.html"
          test -f "$DEPLOY_DIR/_headers"

      - name: Write platform admin config
        if: startsWith(inputs.target, 'admin-')
        env:
          SUPABASE_ANON_KEY: ${{ secrets.PLATFORM_ADMIN_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ANON_KEY"
          cat > apps/platform-admin/config.js <<JS
          window.HABITTA_ADMIN_CONFIG = {
            supabaseUrl: 'https://kgsfaahixbcwcmykmhat.supabase.co',
            supabaseAnonKey: '$SUPABASE_ANON_KEY',
          };
          JS

      - name: Prepare Pages verification context
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "RELEASE_COMMIT=$SHA" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_PAGES_PROJECT_NAME=$PAGES_PROJECT" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_PAGES_PROD_URL=$EXPECTED_URL" >> "$GITHUB_ENV"

      - name: Deploy Pages surface
        run: |
          set -euo pipefail
          pnpm --filter @habitta/api exec wrangler pages deploy "$GITHUB_WORKSPACE/$DEPLOY_DIR" \
            --project-name "$PAGES_PROJECT" \
            --branch "$PAGES_BRANCH" \
            --commit-hash "$RELEASE_COMMIT" \
            --commit-message "static-$INPUT_TARGET-$RELEASE_COMMIT"

      - name: Probe canonical domain
        run: |
          set -euo pipefail
          last_status=000
          for attempt in $(seq 1 12); do
            last_status="$(curl --connect-timeout 5 --max-time 15 -sS -o /dev/null -w '%{http_code}' "$EXPECTED_URL" || true)"
            case "$last_status" in
              2??|3??)
                echo "Healthy HTTP response: $EXPECTED_URL ($last_status)"
                exit 0
                ;;
              403)
                echo "Canonical domain denied this GitHub runner with HTTP 403; requiring Cloudflare control-plane verification next."
                exit 0
                ;;
            esac
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          echo "Canonical domain returned an unexpected status: $EXPECTED_URL ($last_status)" >&2
          exit 1

      - name: Verify Pages control plane
        run: node scripts/release/verify-production-pages-control-plane.mjs
