name: HAB-479 Format

on:
  push:
    branches:
      - hab-479-platform-admin-responsive-accessibility-polish

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hab-479-platform-admin-responsive-accessibility-polish
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format HAB-479 files
        run: >-
          pnpm exec prettier --write
          apps/platform-admin/index.html
          apps/platform-admin/customers.html
          apps/platform-admin/subscriptions.html
          apps/platform-admin/commercial.html
          apps/platform-admin/commercial.js
          apps/platform-admin/platform-shell.css
          apps/web/src/hab479-platform-admin-polish.test.ts
      - run: git diff --check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform-admin apps/web/src/hab479-platform-admin-polish.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore(HAB-479): format platform admin polish"
          git push origin HEAD:hab-479-platform-admin-responsive-accessibility-polish
