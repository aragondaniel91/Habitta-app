name: Recover Responsive Visual Screenshots

on:
  push:
    branches:
      - feat/password-auth-admin-onboarding
    paths:
      - '.github/workflows/recover-visual-screenshots.yml'

permissions:
  contents: write

env:
  BRANCH_NAME: feat/password-auth-admin-onboarding

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/password-auth-admin-onboarding

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm add -Dw @playwright/test@1.54.2 --ignore-workspace-root-check
      - run: pnpm exec playwright install --with-deps chromium

      - name: Build visual review frontend
        env:
          VITE_APP_ENV: development
          VITE_API_BASE_URL: http://127.0.0.1:8787
          VITE_SUPABASE_URL: https://visual.supabase.co
          VITE_SUPABASE_ANON_KEY: visual-anon-key
        run: pnpm --filter @habitta/web build

      - name: Start local preview
        run: |
          nohup pnpm --filter @habitta/web exec vite preview --host 127.0.0.1 --port 4173 > /tmp/habitta-vite.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/habitta-vite.log
          exit 1

      - name: Create visual test
        run: |
          cat > visual-review.spec.ts <<'EOF'
          import { test, expect, type Browser, type Page, type Route } from '@playwright/test';
          import { mkdir } from 'node:fs/promises';

          const origin = 'http://127.0.0.1:4173';
          const storageKey = 'sb-visual-auth-token';
          const now = Math.floor(Date.now() / 1000);
          const userId = '11111111-1111-4111-8111-111111111111';
          const organizationId = '22222222-2222-4222-8222-222222222222';
          const condominiumId = '33333333-3333-4333-8333-333333333333';
          const invitationId = '44444444-4444-4444-8444-444444444444';

          const encode = (value: unknown) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const accessToken = `${encode({ alg: 'HS256', typ: 'JWT' })}.${encode({
            aud: 'authenticated',
            exp: now + 86400,
            iat: now,
            sub: userId,
            email: 'daniel@habitta.test',
            role: 'authenticated',
          })}.visual-signature`;

          const session = {
            access_token: accessToken,
            token_type: 'bearer',
            expires_in: 86400,
            expires_at: now + 86400,
            refresh_token: 'visual-refresh-token',
            user: {
              id: userId,
              aud: 'authenticated',
              role: 'authenticated',
              email: 'daniel@habitta.test',
              email_confirmed_at: new Date().toISOString(),
              phone: '',
              confirmed_at: new Date().toISOString(),
              last_sign_in_at: new Date().toISOString(),
              app_metadata: { provider: 'email', providers: ['email'] },
              user_metadata: { full_name: 'Daniel Aragón' },
              identities: [],
              created_at: new Date().toISOString(),
              updated_at: new Date().toISOString(),
            },
          };

          const organizations = [{ id: organizationId, name: 'Administradora Los Pinos' }];
          const condominiums = [
            { id: condominiumId, name: 'Residencias Los Pinos', organization_id: organizationId },
          ];

          const teamMembers = [
            {
              user_id: userId,
              email: 'daniel@habitta.test',
              full_name: 'Daniel Aragón',
              role: 'condominium_admin',
              joined_at: new Date().toISOString(),
            },
            {
              user_id: '55555555-5555-4555-8555-555555555555',
              email: 'contabilidad@habitta.test',
              full_name: 'María González',
              role: 'accountant',
              joined_at: new Date().toISOString(),
            },
          ];

          const invitations = [
            {
              id: invitationId,
              condominium_id: condominiumId,
              email: 'asistente@habitta.test',
              intended_role: 'assistant',
              status: 'pending',
              expires_at: new Date(Date.now() + 7 * 86400000).toISOString(),
              accepted_at: null,
              revoked_at: null,
              created_at: new Date().toISOString(),
            },
          ];

          async function fulfillJson(route: Route, data: unknown, status = 200) {
            await route.fulfill({
              status,
              contentType: 'application/json',
              body: JSON.stringify(data),
            });
          }

          async function mockNetwork(page: Page, workspace: 'empty' | 'team' | 'none') {
            await page.route('http://127.0.0.1:8787/**', async (route) => {
              const pathname = new URL(route.request().url()).pathname;
              if (pathname === '/v1/organizations') {
                await fulfillJson(route, workspace === 'team' ? organizations : []);
                return;
              }
              if (pathname === '/v1/condominiums') {
                await fulfillJson(route, workspace === 'team' ? condominiums : []);
                return;
              }
              await fulfillJson(route, []);
            });

            await page.route('https://visual.supabase.co/**', async (route) => {
              const url = new URL(route.request().url());
              if (url.pathname.endsWith('/rest/v1/rpc/get_admin_invitation_preview')) {
                await fulfillJson(route, {
                  id: invitationId,
                  email: 'invitado@habitta.test',
                  condominium_id: condominiumId,
                  condominium_name: 'Residencias Los Pinos',
                  intended_role: 'assistant',
                  status: 'pending',
                  expires_at: new Date(Date.now() + 7 * 86400000).toISOString(),
                });
                return;
              }
              if (url.pathname.endsWith('/rest/v1/rpc/list_condominium_team')) {
                await fulfillJson(route, teamMembers);
                return;
              }
              if (url.pathname.endsWith('/rest/v1/admin_invitations')) {
                await fulfillJson(route, invitations);
                return;
              }
              if (url.pathname.endsWith('/auth/v1/user')) {
                await fulfillJson(route, session.user);
                return;
              }
              if (url.pathname.endsWith('/auth/v1/token')) {
                await fulfillJson(route, session);
                return;
              }
              await fulfillJson(route, {});
            });
          }

          async function createPage(
            browser: Browser,
            viewport: { width: number; height: number },
            authenticated: boolean,
            workspace: 'empty' | 'team' | 'none',
          ) {
            const context = await browser.newContext({ viewport });
            if (authenticated) {
              await context.addInitScript(
                ({ key, value }) => window.localStorage.setItem(key, JSON.stringify(value)),
                { key: storageKey, value: session },
              );
            }
            const page = await context.newPage();
            await mockNetwork(page, workspace);
            return { context, page };
          }

          async function shot(page: Page, name: string) {
            await page.waitForTimeout(350);
            await page.screenshot({ path: `visual-screenshots/${name}.png`, fullPage: true });
          }

          test('capture responsive authentication and onboarding flows', async ({ browser }) => {
            await mkdir('visual-screenshots', { recursive: true });

            {
              const { context, page } = await createPage(browser, { width: 1440, height: 1000 }, false, 'none');
              await page.goto(origin);
              await expect(page.getByRole('heading', { name: 'Bienvenido a Habitta' })).toBeVisible();
              await page.getByLabel('Correo electrónico').fill('administrador@habitta.test');
              await page.locator('input[autocomplete="current-password"]').fill('Habitta2026');
              await shot(page, '01-login-desktop');
              await context.close();
            }

            {
              const { context, page } = await createPage(browser, { width: 390, height: 844 }, false, 'none');
              await page.goto(origin);
              await expect(page.getByRole('heading', { name: 'Bienvenido a Habitta' })).toBeVisible();
              await shot(page, '02-login-mobile');
              await context.close();
            }

            {
              const { context, page } = await createPage(browser, { width: 1440, height: 1100 }, false, 'none');
              await page.goto(origin);
              await page.getByRole('button', { name: 'Crear cuenta', exact: true }).click();
              await page.getByLabel('Nombre y apellido').fill('Juan Pérez');
              await page.getByLabel('Correo electrónico').fill('juan@habitta.test');
              await page.locator('input[autocomplete="new-password"]').nth(0).fill('Habitta2026');
              await page.locator('input[autocomplete="new-password"]').nth(1).fill('Habitta2026');
              await shot(page, '03-registration-desktop');
              await context.close();
            }

            {
              const { context, page } = await createPage(browser, { width: 390, height: 844 }, false, 'none');
              await page.goto(origin);
              await page.getByRole('button', { name: 'Crear cuenta', exact: true }).click();
              await shot(page, '04-registration-mobile');
              await context.close();
            }

            {
              const { context, page } = await createPage(browser, { width: 1440, height: 1000 }, false, 'none');
              await page.goto(origin);
              await page.getByRole('button', { name: '¿Olvidaste tu contraseña?' }).click();
              await expect(page.getByRole('heading', { name: 'Recupera tu contraseña' })).toBeVisible();
              await shot(page, '05-forgot-password-desktop');
              await context.close();
            }

            {
              const { context, page } = await createPage(browser, { width: 1440, height: 1000 }, true, 'empty');
              await page.goto(origin);
              await expect(page.getByRole('heading', { name: '¿Cómo trabajarás con Habitta?' })).toBeVisible();
              await shot(page, '06-onboarding-administration-desktop');
              await page.getByLabel('Nombre de la organización').fill('Administradora Los Pinos');
              await page.getByRole('button', { name: 'Continuar', exact: true }).click();
              await expect(page.getByRole('heading', { name: 'Registra la información principal.' })).toBeVisible();
              await page.getByLabel('Nombre del condominio').fill('Residencias Los Pinos');
              await page.getByLabel('Ciudad').fill('Caracas');
              await page.getByLabel('Cantidad aproximada de unidades').fill('120');
              await page.getByLabel('Nombre de la primera torre').fill('Torre A');
              await shot(page, '07-onboarding-condominium-desktop');
              await context.close();
            }

            {
              const { context, page } = await createPage(browser, { width: 390, height: 844 }, true, 'empty');
              await page.goto(origin);
              await page.getByLabel('Nombre de la organización').fill('Administradora Los Pinos');
              await page.getByRole('button', { name: 'Continuar', exact: true }).click();
              await expect(page.getByRole('heading', { name: 'Registra la información principal.' })).toBeVisible();
              await shot(page, '08-onboarding-condominium-mobile');
              await context.close();
            }

            {
              const { context, page } = await createPage(browser, { width: 1440, height: 1000 }, true, 'none');
              await page.goto(`${origin}/reset-password`);
              await expect(page.getByRole('heading', { name: 'Crea una contraseña nueva' })).toBeVisible();
              await shot(page, '09-password-reset-desktop');
              await context.close();
            }

            {
              const { context, page } = await createPage(browser, { width: 1440, height: 1000 }, false, 'none');
              await page.goto(`${origin}/admin-invite/visual-token`);
              await expect(page.getByRole('heading', { name: 'Asistente administrativo' })).toBeVisible();
              await shot(page, '10-admin-invitation-desktop');
              await context.close();
            }

            {
              const { context, page } = await createPage(browser, { width: 390, height: 844 }, false, 'none');
              await page.goto(`${origin}/admin-invite/visual-token`);
              await expect(page.getByRole('heading', { name: 'Asistente administrativo' })).toBeVisible();
              await page.getByRole('button', { name: 'Crear contraseña' }).click();
              await shot(page, '11-admin-invitation-mobile');
              await context.close();
            }

            {
              const { context, page } = await createPage(browser, { width: 1440, height: 1000 }, true, 'team');
              await page.goto(`${origin}/app/team`);
              await expect(page.getByRole('heading', { name: 'Equipo y accesos', exact: true })).toBeVisible();
              await shot(page, '12-team-access-desktop');
              await context.close();
            }

            {
              const { context, page } = await createPage(browser, { width: 390, height: 844 }, true, 'team');
              await page.goto(`${origin}/app/team`);
              await expect(page.getByRole('heading', { name: 'Equipo y accesos', exact: true })).toBeVisible();
              await shot(page, '13-team-access-mobile');
              await context.close();
            }
          });
          EOF

      - name: Capture responsive screenshots
        run: pnpm exec playwright test visual-review.spec.ts --reporter=line

      - name: Create contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          files = sorted(Path('visual-screenshots').glob('*.png'))
          thumbs = []
          font = ImageFont.load_default()
          width = 640
          for file in files:
              image = Image.open(file).convert('RGB')
              ratio = width / image.width
              thumb = image.resize((width, max(1, int(image.height * ratio))))
              label_h = 34
              card = Image.new('RGB', (width, thumb.height + label_h), 'white')
              card.paste(thumb, (0, label_h))
              draw = ImageDraw.Draw(card)
              draw.text((10, 10), file.stem, fill='black', font=font)
              thumbs.append(card)

          columns = 2
          gap = 18
          rows = (len(thumbs) + columns - 1) // columns
          row_heights = []
          for row in range(rows):
              row_items = thumbs[row * columns:(row + 1) * columns]
              row_heights.append(max(item.height for item in row_items))
          sheet_w = columns * width + (columns + 1) * gap
          sheet_h = sum(row_heights) + (rows + 1) * gap
          sheet = Image.new('RGB', (sheet_w, sheet_h), '#eef1f5')
          y = gap
          for row in range(rows):
              x = gap
              for item in thumbs[row * columns:(row + 1) * columns]:
                  sheet.paste(item, (x, y))
                  x += width + gap
              y += row_heights[row] + gap
          sheet.save('habitta-responsive-contact-sheet.jpg', quality=82, optimize=True)
          PY
          zip -r habitta-responsive-screenshots.zip visual-screenshots habitta-responsive-contact-sheet.jpg

      - name: Upload responsive screenshots
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: habitta-responsive-screenshots
          path: |
            visual-screenshots
            habitta-responsive-contact-sheet.jpg
            habitta-responsive-screenshots.zip
          if-no-files-found: error
          retention-days: 7

      - name: Record artifact identifier
        run: |
          printf '{"run_id":%s,"artifact_id":%s,"artifact_url":"%s"}\n' \
            '${{ github.run_id }}' \
            '${{ steps.upload.outputs.artifact-id }}' \
            '${{ steps.upload.outputs.artifact-url }}' > visual-artifact.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-artifact.json
          git commit -m "chore: record responsive screenshot artifact"
          git push origin HEAD:${BRANCH_NAME}
