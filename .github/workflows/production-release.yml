name: Production Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Main or a commit contained in main
        required: true
        default: main
      confirmation:
        description: Type DEPLOY-HABITTA-PRODUCTION
        required: true
      confirm_project_ref:
        description: Must exactly match SUPABASE_PROJECT_REF
        required: true

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_ENV: production
      NOTIFICATIONS_EMAIL_MODE: live
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_API_BASE_URL: https://habitta-api-prod.aragondaniel91.workers.dev
      CLOUDFLARE_WORKER_PROD_URL: https://habitta-api-prod.aragondaniel91.workers.dev
      CLOUDFLARE_PAGES_PROJECT_NAME: habitta-web-prod
      CLOUDFLARE_PAGES_PROD_URL: https://app.mihabitta.com
      CORS_ALLOWED_ORIGINS: https://app.mihabitta.com
      BACKUP_BUCKET: habitta-database-backups-prod
      HABITTA_PROD_PROJECT_REF: kgsfaahixbcwcmykmhat
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ZEPTOMAIL_SEND_TOKEN: ${{ secrets.ZEPTOMAIL_SEND_TOKEN }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      INPUT_RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}
      INPUT_CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.INPUT_RELEASE_REF }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
      - name: Validate production release invariants
        run: |
          set -euo pipefail
          for name in ZEPTOMAIL_SEND_TOKEN SUPABASE_PROJECT_REF SUPABASE_URL VITE_SUPABASE_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY BACKUP_ENCRYPTION_PASSPHRASE; do
            test -n "${!name:-}" || { echo "Missing required production setting: $name" >&2; exit 1; }
          done
          node scripts/release/validate-production-release.mjs
          test "$VITE_API_BASE_URL" = "$CLOUDFLARE_WORKER_PROD_URL"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$INPUT_CONFIRMATION" = DEPLOY-HABITTA-PRODUCTION
            test "$INPUT_CONFIRM_PROJECT_REF" = "$SUPABASE_PROJECT_REF"
          fi
          git fetch origin main
          SHA=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$SHA" origin/main
          echo "RELEASE_COMMIT=$SHA" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Validate repository
        run: |
          pnpm notifications:config:check
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          git diff --check
      - name: Verify production Supabase API credentials
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/settings"
          curl -fsS -o /dev/null \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/"
      - name: Provision isolated production resources
        run: |
          set -euo pipefail
          QUEUES=$(pnpm --filter @habitta/api exec wrangler queues list)
          for NAME in \
            habitta-notifications-prod \
            habitta-notifications-dlq-prod \
            habitta-integrations-prod \
            habitta-integrations-dlq-prod; do
            if ! printf '%s\n' "$QUEUES" | grep -Fq "$NAME"; then
              pnpm --filter @habitta/api exec wrangler queues create "$NAME"
            fi
          done
          BUCKETS=$(pnpm --filter @habitta/api exec wrangler r2 bucket list)
          for NAME in habitta-payment-proofs-prod habitta-database-backups-prod; do
            if ! printf '%s\n' "$BUCKETS" | grep -Fq "$NAME"; then
              pnpm --filter @habitta/api exec wrangler r2 bucket create "$NAME"
            fi
          done
          PAGES=$(pnpm --filter @habitta/api exec wrangler pages project list)
          if ! printf '%s\n' "$PAGES" | grep -Fq 'habitta-web-prod'; then
            pnpm --filter @habitta/api exec wrangler pages project create habitta-web-prod --production-branch main
          fi
      - name: Capture production rollback targets
        run: |
          set -euo pipefail
          WORKER_STATUS="$RUNNER_TEMP/production-worker-status.json"
          if pnpm --filter @habitta/api exec wrangler deployments status --env prod --json >"$WORKER_STATUS" 2>/dev/null; then
            PREVIOUS_WORKER_VERSION=$(jq -r '[.versions[]? | select(.percentage == 100)] | if length == 1 then .[0].version_id else empty end' "$WORKER_STATUS")
          else
            PREVIOUS_WORKER_VERSION=''
          fi

          PROJECT_JSON=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT_NAME")
          printf '%s' "$PROJECT_JSON" | jq -e '.success == true' >/dev/null
          PREVIOUS_PAGES_DEPLOYMENT=$(printf '%s' "$PROJECT_JSON" | jq -r '.result.canonical_deployment.id // empty')

          echo "PREVIOUS_WORKER_VERSION=$PREVIOUS_WORKER_VERSION" >> "$GITHUB_ENV"
          echo "PREVIOUS_PAGES_DEPLOYMENT=$PREVIOUS_PAGES_DEPLOYMENT" >> "$GITHUB_ENV"
      - name: Create encrypted pre-migration backup
        run: bash scripts/release/pre-migration-production-backup.sh
      - name: Apply reviewed Supabase migrations
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked
          supabase db push --dry-run
          supabase db push
          supabase migration list --linked
      - name: Build production artifacts
        env:
          HABITTA_REMOTE_RELEASE: 'true'
          VITE_APP_ENV: production
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          pnpm --filter @habitta/api build
          pnpm --filter @habitta/web build
          pnpm release:dev:verify-web
          if ! grep -R -F "$SUPABASE_URL" apps/web/dist >/dev/null; then
            echo 'Production web bundle does not contain the canonical Habitta Production Supabase URL.' >&2
            exit 1
          fi
      - name: Bootstrap or update production Worker
        run: |
          set -euo pipefail
          SECRETS_FILE="$RUNNER_TEMP/production-worker-secrets"
          VERSION_LIST_FILE="$RUNNER_TEMP/production-worker-versions.json"
          ACTIVE_STATUS_FILE="$RUNNER_TEMP/production-worker-active.json"
          cleanup() {
            rm -f "$SECRETS_FILE" "$VERSION_LIST_FILE" "$ACTIVE_STATUS_FILE"
          }
          trap cleanup EXIT
          node scripts/release/create-worker-secrets-file.mjs "$SECRETS_FILE"
          SHA=$(git rev-parse HEAD)
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          APP_VERSION=$(node -p "require('./apps/api/package.json').version || '0.0.0'")
          TAG="production-$SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          COMMON_ARGS=(
            --env prod
            --secrets-file "$SECRETS_FILE"
            --message "$TAG"
            --tag "$TAG"
            --keep-vars
            --var "BUILD_COMMIT:$SHA"
            --var "BUILD_TIMESTAMP:$BUILD_TIMESTAMP"
            --var "APP_VERSION:$APP_VERSION"
            --var "APP_ENV:production"
            --var "SUPABASE_URL:$SUPABASE_URL"
            --var "NOTIFICATIONS_EMAIL_MODE:live"
            --var "CORS_ALLOWED_ORIGINS:$CORS_ALLOWED_ORIGINS"
            --var "APP_BASE_URL:$CLOUDFLARE_PAGES_PROD_URL"
          )
          if [ -z "$PREVIOUS_WORKER_VERSION" ]; then
            echo 'Bootstrapping the first production Worker deployment.'
            pnpm --filter @habitta/api exec wrangler deploy "${COMMON_ARGS[@]}"
          else
            pnpm --filter @habitta/api exec wrangler versions upload "${COMMON_ARGS[@]}"
            pnpm --filter @habitta/api exec wrangler versions list --env prod --json >"$VERSION_LIST_FILE"
            ACTIVE_VERSION_ID=$(jq -r --arg tag "$TAG" '[.[] | select(.annotations["workers/tag"] == $tag)] | if length == 1 then .[0].id else empty end' "$VERSION_LIST_FILE")
            test -n "$ACTIVE_VERSION_ID"
            pnpm --filter @habitta/api exec wrangler versions deploy "$ACTIVE_VERSION_ID@100%" --env prod --yes
          fi
          pnpm --filter @habitta/api exec wrangler deployments status --env prod --json >"$ACTIVE_STATUS_FILE"
          ACTIVE_VERSION_ID=$(jq -r '[.versions[]? | select(.percentage == 100)] | if length == 1 then .[0].version_id else empty end' "$ACTIVE_STATUS_FILE")
          test -n "$ACTIVE_VERSION_ID"
          echo "ACTIVE_WORKER_VERSION=$ACTIVE_VERSION_ID" >> "$GITHUB_ENV"
          echo 'WORKER_DEPLOYED=true' >> "$GITHUB_ENV"
      - name: Smoke production Worker
        run: |
          node --input-type=module <<'NODE'
          const apiUrl = process.env.CLOUDFLARE_WORKER_PROD_URL;
          const origin = process.env.CLOUDFLARE_PAGES_PROD_URL;
          const expectedCommit = process.env.RELEASE_COMMIT;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let lastError;
          for (let attempt = 1; attempt <= 10; attempt += 1) {
            try {
              const health = await fetch(`${apiUrl}/health`, { headers: { Origin: origin } });
              if (!health.ok) throw new Error(`health_${health.status}`);
              const metadata = await health.json();
              if (metadata.environment !== 'production') throw new Error('environment_mismatch');
              if (metadata.commit !== expectedCommit) throw new Error('commit_mismatch');
              if (metadata.notificationsEmailMode !== 'live') throw new Error('email_mode_mismatch');
              if (health.headers.get('access-control-allow-origin') !== origin)
                throw new Error('cors_mismatch');
              const missing = await fetch(`${apiUrl}/not-a-route`, { headers: { Origin: origin } });
              if (missing.status !== 404) throw new Error('missing_route_mismatch');
              const unauthorized = await fetch(`${apiUrl}/v1/organizations`, {
                headers: { Origin: origin },
              });
              if (unauthorized.status !== 401) throw new Error('auth_guard_mismatch');
              lastError = undefined;
              break;
            } catch (error) {
              lastError = error;
              if (attempt < 10) await sleep(5_000);
            }
          }
          if (lastError) throw lastError;
          NODE
      - name: Deploy production Pages
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          DEPLOY_OUTPUT=$(pnpm --filter @habitta/api exec wrangler pages deploy ../web/dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch main \
            --commit-hash "$SHA" \
            --commit-message "production-$SHA" 2>&1)
          printf '%s\n' "$DEPLOY_OUTPUT"
          PAGES_DEPLOYMENT_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[a-z0-9]+\.habitta-web-prod\.pages\.dev' | tail -1)
          test -n "$PAGES_DEPLOYMENT_URL"
          echo "PAGES_DEPLOYMENT_URL=$PAGES_DEPLOYMENT_URL" >> "$GITHUB_ENV"
          echo 'PAGES_DEPLOYED=true' >> "$GITHUB_ENV"
      - name: End-to-end production smoke
        run: |
          node --input-type=module <<'NODE'
          const deploymentUrl = process.env.PAGES_DEPLOYMENT_URL;
          const canonicalUrl = process.env.CLOUDFLARE_PAGES_PROD_URL;
          const apiUrl = process.env.CLOUDFLARE_WORKER_PROD_URL;
          const origin = canonicalUrl;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let lastError;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const web = await fetch(`${deploymentUrl}/app/dashboard`);
              if (!web.ok) throw new Error(`deployment_web_${web.status}`);
              const preflight = await fetch(`${apiUrl}/v1/organizations`, {
                method: 'OPTIONS',
                headers: {
                  Origin: origin,
                  'Access-Control-Request-Method': 'GET',
                },
              });
              if (!preflight.ok || preflight.headers.get('access-control-allow-origin') !== origin)
                throw new Error('preflight_mismatch');
              const canonical = await fetch(`${canonicalUrl}/app/dashboard`, { redirect: 'manual' });
              if (!canonical.ok && (canonical.status < 300 || canonical.status >= 400))
                throw new Error(`canonical_web_${canonical.status}`);
              lastError = undefined;
              break;
            } catch (error) {
              lastError = error;
              if (attempt < 12) await sleep(5_000);
            }
          }
          if (lastError) throw lastError;
          NODE
      - name: Roll back production edge deploys on release failure
        if: ${{ failure() }}
        run: |
          set +e
          if [ "${WORKER_DEPLOYED:-false}" = true ] && [ -n "${PREVIOUS_WORKER_VERSION:-}" ]; then
            echo "Rolling Worker back to $PREVIOUS_WORKER_VERSION"
            pnpm --filter @habitta/api exec wrangler versions deploy "$PREVIOUS_WORKER_VERSION@100%" --env prod --yes
          fi
          if [ "${PAGES_DEPLOYED:-false}" = true ] && [ -n "${PREVIOUS_PAGES_DEPLOYMENT:-}" ]; then
            echo "Rolling Pages back to $PREVIOUS_PAGES_DEPLOYMENT"
            curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT_NAME/deployments/$PREVIOUS_PAGES_DEPLOYMENT/rollback" \
              | jq -e '.success == true' >/dev/null
          fi
