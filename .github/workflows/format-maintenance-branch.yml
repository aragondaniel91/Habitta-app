name: Temporary maintenance formatter

on:
  push:
    branches:
      - feature/maintenance-admin-workspace
    paths:
      - apps/web/src/lib/maintenance.ts
      - apps/web/src/maintenance.css
      - apps/web/src/pages/MaintenancePage.tsx
      - .github/workflows/format-maintenance-branch.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/maintenance-admin-workspace
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/lib/maintenance.ts apps/web/src/maintenance.css apps/web/src/pages/MaintenancePage.tsx
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/maintenance.ts apps/web/src/maintenance.css apps/web/src/pages/MaintenancePage.tsx
          git commit -m "Format maintenance workspace"
          git push origin HEAD:feature/maintenance-admin-workspace
