name: Temp HAB-183 Migration Name

on:
  push:
    branches:
      - agent/hab-183-condo-profile-topology

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.114.0
          github-token: ${{ github.token }}
      - name: Generate migration name
        run: |
          set -euo pipefail
          rm -rf /tmp/hab183-migration
          mkdir -p /tmp/hab183-migration/supabase/migrations
          cd /tmp/hab183-migration
          supabase migration new hab183_condominium_profile_topology
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n'
