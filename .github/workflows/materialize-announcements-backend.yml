name: Materialize announcements backend

on:
  push:
    branches:
      - feat/backend-announcements-foundation
    paths:
      - scripts/patch-announcements-backend.py
      - .github/workflows/materialize-announcements-backend.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply announcements integration
        run: |
          python scripts/patch-announcements-backend.py
          rm -f scripts/patch-announcements-backend.py
          rm -f .github/workflows/materialize-announcements-backend.yml
          pnpm format
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add announcements backend foundation"
          git push origin HEAD:${{ github.ref_name }}
