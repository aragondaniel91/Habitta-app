name: Treasury visual review

on:
  push:
    branches:
      - feature/treasury-workspace

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/treasury-workspace
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install visual review browser
        run: |
          mkdir -p "$RUNNER_TEMP/treasury-visual"
          cd "$RUNNER_TEMP/treasury-visual"
          npm init -y >/dev/null
          npm install playwright@1.54.2 >/dev/null
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/scripts/treasury-visual-capture.mjs" capture.mjs
      - name: Start Vite
        run: |
          pnpm --filter @habitta/web dev --host 127.0.0.1 --port 4173 >"$RUNNER_TEMP/treasury-vite.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/treasury-visual-review.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/treasury-vite.log"
          exit 1
      - name: Capture desktop and mobile views
        env:
          VISUAL_OUTPUT: ${{ github.workspace }}/treasury-visual-review
        run: cd "$RUNNER_TEMP/treasury-visual" && node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: treasury-visual-review
          path: treasury-visual-review/*.png
      - name: Remove temporary visual harness
        run: |
          rm .github/workflows/treasury-visual-review.yml
          rm apps/web/treasury-visual-review.html
          rm apps/web/src/treasury-visual-review.tsx
          rm scripts/treasury-visual-capture.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove temporary Treasury visual review harness"
          git push origin HEAD:feature/treasury-workspace
