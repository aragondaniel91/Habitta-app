name: Development Release Apply

on:
  workflow_dispatch:
    inputs:
      release_ref:
        { description: Main or a commit contained in main, required: true, default: main }
      confirmation: { description: Type DEPLOY-HABITTA-DEVELOPMENT, required: true }

permissions:
  contents: read
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: development
    env:
      APP_ENV: development
      NOTIFICATIONS_EMAIL_MODE: disabled
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
      CLOUDFLARE_WORKER_DEV_URL: ${{ vars.CLOUDFLARE_WORKER_DEV_URL }}
      CLOUDFLARE_PAGES_DEV_URL: ${{ vars.CLOUDFLARE_PAGES_DEV_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ inputs.release_ref }}'
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
      - name: Validate approval, ref and release invariants
        run: |
          test "${{ inputs.confirmation }}" = DEPLOY-HABITTA-DEVELOPMENT
          git fetch origin main
          SHA=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$SHA" origin/main
          test "$APP_ENV" = development
          test "$NOTIFICATIONS_EMAIL_MODE" = disabled
          test -n "$SUPABASE_PROJECT_REF"
          ! gh pr list --repo "$GITHUB_REPOSITORY" --state open --search "$SHA" --json number --jq 'length > 0' | grep true
      - run: pnpm install --frozen-lockfile
      - run: pnpm notifications:config:check
      - run: pnpm release:dev:validate
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test && git diff --check
      - name: Provision only missing development resources
        run: pnpm release:dev:resources:apply -- --apply
      - name: Apply reviewed Supabase migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked
          supabase db push
          supabase migration list --linked
      - name: Build and verify public web bundle
        env:
          HABITTA_REMOTE_RELEASE: 'true'
          VITE_APP_ENV: development
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          pnpm --filter @habitta/api build
          pnpm --filter @habitta/web build
          pnpm release:dev:verify-web
      - name: Upload then promote Worker version
        run: |
          SECRETS_FILE="$RUNNER_TEMP/release-worker-secrets"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node scripts/release/create-worker-secrets-file.mjs "$SECRETS_FILE"
          SHA=$(git rev-parse HEAD)
          PREVIOUS_VERSION=$(pnpm --filter @habitta/api exec wrangler versions view --env dev --json | jq -r '.id // empty')
          UPLOAD=$(pnpm --filter @habitta/api exec wrangler versions upload --env dev --secrets-file "$SECRETS_FILE" --message "release-$SHA" --tag "release-$SHA" --strict)
          VERSION_ID=$(printf '%s' "$UPLOAD" | jq -r '.id // empty')
          test -n "$VERSION_ID"
          pnpm --filter @habitta/api exec wrangler versions view "$VERSION_ID" --env dev
          pnpm --filter @habitta/api exec wrangler versions deploy "$VERSION_ID@100%" --env dev
          printf '{"commit":"%s","versionId":"%s","previousVersion":"%s","environment":"development"}\n' "$SHA" "$VERSION_ID" "$PREVIOUS_VERSION" > release-worker-metadata.json
          echo "PREVIOUS_WORKER_VERSION=$PREVIOUS_VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: development-worker-release-metadata
          path: release-worker-metadata.json
      - name: Smoke Worker before Pages
        run: |
          if ! pnpm release:dev:smoke -- --api-url "$CLOUDFLARE_WORKER_DEV_URL" --expected-commit "$(git rev-parse HEAD)" --email-mode disabled; then
            test -n "$PREVIOUS_WORKER_VERSION" && pnpm --filter @habitta/api exec wrangler versions deploy "$PREVIOUS_WORKER_VERSION@100%" --env dev
            exit 1
          fi
      - name: Deploy Pages only after Worker smoke
        run: pnpm --filter @habitta/api exec wrangler pages deploy apps/web/dist --project-name habitta-web-dev --branch development
      - name: End-to-end development smoke
        run: pnpm release:dev:smoke -- --api-url "$CLOUDFLARE_WORKER_DEV_URL" --web-url "$CLOUDFLARE_PAGES_DEV_URL" --expected-commit "$(git rev-parse HEAD)" --email-mode disabled
