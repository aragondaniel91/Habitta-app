name: Development Release Apply

on:
  workflow_dispatch:
    inputs:
      release_ref:
        { description: Main or a commit contained in main, required: true, default: main }
      confirmation: { description: Type DEPLOY-HABITTA-DEVELOPMENT, required: true }
      confirm_project_ref: { description: Must exactly match SUPABASE_PROJECT_REF, required: true }

permissions:
  contents: read
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      NOTIFICATIONS_EMAIL_MODE: disabled
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
      CLOUDFLARE_WORKER_DEV_URL: ${{ vars.CLOUDFLARE_WORKER_DEV_URL }}
      CLOUDFLARE_PAGES_DEV_URL: ${{ vars.CLOUDFLARE_PAGES_DEV_URL }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CLOUDFLARE_PAGES_DEV_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
      INPUT_RELEASE_REF: ${{ inputs.release_ref }}
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}
      INPUT_CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ env.INPUT_RELEASE_REF }}'
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
      - name: Validate approval, ref and release invariants
        run: |
          test "$INPUT_CONFIRMATION" = DEPLOY-HABITTA-DEVELOPMENT
          test -n "$INPUT_CONFIRM_PROJECT_REF"
          test -n "$SUPABASE_PROJECT_REF"
          test "$INPUT_CONFIRM_PROJECT_REF" = "$SUPABASE_PROJECT_REF"
          test -n "$CLOUDFLARE_WORKER_DEV_URL"
          test -n "$CLOUDFLARE_PAGES_DEV_URL"
          git fetch origin main
          if [ "$INPUT_RELEASE_REF" = main ]; then SHA=$(git rev-parse origin/main); else
            printf '%s' "$INPUT_RELEASE_REF" | grep -Eq '^[0-9a-f]{40}$'
            git cat-file -e "$INPUT_RELEASE_REF^{commit}"
            SHA=$(git rev-parse "$INPUT_RELEASE_REF^{commit}")
          fi
          git merge-base --is-ancestor "$SHA" origin/main
          test "$APP_ENV" = development
          test "$NOTIFICATIONS_EMAIL_MODE" = disabled
          test -n "$SUPABASE_PROJECT_REF"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '[.[] | select(.state == "open")] | length')" = 0
      - run: pnpm install --frozen-lockfile
      - run: pnpm notifications:config:check
      - run: pnpm release:dev:validate
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test && pnpm build && git diff --check
      - name: Provision only missing development resources
        run: pnpm release:dev:resources:apply -- --apply
      - name: Apply reviewed Supabase migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked
          supabase db push --dry-run
          supabase db push
          supabase migration list --linked
      - name: Build and verify public web bundle
        env:
          HABITTA_REMOTE_RELEASE: 'true'
          VITE_APP_ENV: development
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          pnpm --filter @habitta/api build
          pnpm --filter @habitta/web build
          pnpm release:dev:verify-web
      - name: Bootstrap or update development Worker
        run: |
          SECRETS_FILE="$RUNNER_TEMP/release-worker-secrets"
          PREVIOUS_STATUS_FILE="$RUNNER_TEMP/previous-worker-status.json"
          PREVIOUS_STATUS_ERROR="$RUNNER_TEMP/previous-worker-status.err"
          VERSION_LIST_FILE="$RUNNER_TEMP/worker-versions.json"
          ACTIVE_STATUS_FILE="$RUNNER_TEMP/worker-active-status.json"
          cleanup() {
            rm -f "$SECRETS_FILE" "$PREVIOUS_STATUS_FILE" "$PREVIOUS_STATUS_ERROR" "$VERSION_LIST_FILE" "$ACTIVE_STATUS_FILE"
          }
          trap cleanup EXIT
          node scripts/release/create-worker-secrets-file.mjs "$SECRETS_FILE"
          SHA=$(git rev-parse HEAD)
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          APP_VERSION=$(node -p "require('./apps/api/package.json').version || '0.0.0'")
          if pnpm --filter @habitta/api exec wrangler deployments status --env dev --json >"$PREVIOUS_STATUS_FILE" 2>"$PREVIOUS_STATUS_ERROR"; then
            jq -e 'type == "object"' "$PREVIOUS_STATUS_FILE" >/dev/null
          else
            printf '{}' >"$PREVIOUS_STATUS_FILE"
          fi
          PREVIOUS_VERSION=$(jq -r '[.versions[]? | select(.percentage == 100)] | if length == 1 then .[0].version_id else empty end' "$PREVIOUS_STATUS_FILE")
          TAG="release-$SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          COMMON_ARGS=(
            --env dev
            --secrets-file "$SECRETS_FILE"
            --message "$TAG"
            --tag "$TAG"
            --strict
            --var "BUILD_COMMIT:$SHA"
            --var "BUILD_TIMESTAMP:$BUILD_TIMESTAMP"
            --var "APP_VERSION:$APP_VERSION"
            --var "APP_ENV:development"
            --var "SUPABASE_URL:$SUPABASE_URL"
            --var "NOTIFICATIONS_EMAIL_MODE:disabled"
            --var "CORS_ALLOWED_ORIGINS:$CORS_ALLOWED_ORIGINS"
          )
          if [ -z "$PREVIOUS_VERSION" ]; then
            echo 'Bootstrapping the first development Worker deployment.'
            pnpm --filter @habitta/api exec wrangler deploy "${COMMON_ARGS[@]}"
            WORKER_BOOTSTRAPPED=true
          else
            echo 'Uploading and promoting a new development Worker version.'
            pnpm --filter @habitta/api exec wrangler versions upload "${COMMON_ARGS[@]}"
            WORKER_BOOTSTRAPPED=false
          fi
          pnpm --filter @habitta/api exec wrangler versions list --env dev --json >"$VERSION_LIST_FILE"
          jq -e 'type == "array"' "$VERSION_LIST_FILE" >/dev/null
          ACTIVE_VERSION_ID=$(jq -r --arg tag "$TAG" '[.[] | select(.annotations["workers/tag"] == $tag)] | if length == 1 then .[0].id else empty end' "$VERSION_LIST_FILE")
          test -n "$ACTIVE_VERSION_ID"
          pnpm --filter @habitta/api exec wrangler versions view "$ACTIVE_VERSION_ID" --env dev --json >/dev/null
          if [ "$WORKER_BOOTSTRAPPED" = false ]; then
            pnpm --filter @habitta/api exec wrangler versions deploy "$ACTIVE_VERSION_ID@100%" --env dev --yes
          fi
          pnpm --filter @habitta/api exec wrangler deployments status --env dev --json >"$ACTIVE_STATUS_FILE"
          jq -e 'type == "object"' "$ACTIVE_STATUS_FILE" >/dev/null
          jq -e --arg id "$ACTIVE_VERSION_ID" '[.versions[]? | select(.version_id == $id and .percentage == 100)] | length == 1' "$ACTIVE_STATUS_FILE" >/dev/null
          jq -n \
            --arg commit "$SHA" \
            --arg activeVersionId "$ACTIVE_VERSION_ID" \
            --arg previousVersionId "$PREVIOUS_VERSION" \
            --arg timestamp "$BUILD_TIMESTAMP" \
            --argjson bootstrapped "$WORKER_BOOTSTRAPPED" \
            '{commit:$commit,activeVersionId:$activeVersionId,previousVersionId:$previousVersionId,timestamp:$timestamp,environment:"development",bootstrapped:$bootstrapped}' \
            > release-worker-metadata.json
          echo "PREVIOUS_WORKER_VERSION=$PREVIOUS_VERSION" >> "$GITHUB_ENV"
          echo "ACTIVE_WORKER_VERSION=$ACTIVE_VERSION_ID" >> "$GITHUB_ENV"
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
      - name: Smoke Worker before Pages
        run: |
          if ! pnpm release:dev:smoke -- --api-url "$CLOUDFLARE_WORKER_DEV_URL" --expected-web-origin "$CLOUDFLARE_PAGES_DEV_URL" --expected-commit "$(git rev-parse HEAD)" --email-mode disabled; then
            if [ -n "$PREVIOUS_WORKER_VERSION" ]; then
              pnpm --filter @habitta/api exec wrangler versions deploy "$PREVIOUS_WORKER_VERSION@100%" --env dev --yes
            fi
            exit 1
          fi
      - name: Deploy Pages and capture exact deployment metadata
        run: |
          BEFORE_PAGES_FILE="$RUNNER_TEMP/pages-deployments-before.json"
          AFTER_PAGES_FILE="$RUNNER_TEMP/pages-deployments-after.json"
          cleanup() {
            rm -f "$BEFORE_PAGES_FILE" "$AFTER_PAGES_FILE"
          }
          trap cleanup EXIT
          pnpm --filter @habitta/api exec wrangler pages deployment list --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --json >"$BEFORE_PAGES_FILE"
          jq -e 'type == "array"' "$BEFORE_PAGES_FILE" >/dev/null
          PREVIOUS_PAGE_ID=$(jq -r '[.[] | select(.deployment_trigger.metadata.branch == "development")] | sort_by(.created_on) | reverse | .[0].id // empty' "$BEFORE_PAGES_FILE")
          PREVIOUS_PAGE_URL=$(jq -r '[.[] | select(.deployment_trigger.metadata.branch == "development")] | sort_by(.created_on) | reverse | .[0].url // empty' "$BEFORE_PAGES_FILE")
          SHA=$(git rev-parse HEAD)
          pnpm --filter @habitta/api exec wrangler pages deploy "$GITHUB_WORKSPACE/apps/web/dist" --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch development --commit-hash "$SHA" --commit-message "release-$SHA"
          pnpm --filter @habitta/api exec wrangler pages deployment list --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --json >"$AFTER_PAGES_FILE"
          jq -e 'type == "array"' "$AFTER_PAGES_FILE" >/dev/null
          CURRENT_PAGE=$(jq -cn --slurpfile before "$BEFORE_PAGES_FILE" --slurpfile after "$AFTER_PAGES_FILE" --arg sha "$SHA" '
            ($before[0] | map(.id)) as $beforeIds |
            [$after[0][] | . as $candidate | select(
              .deployment_trigger.metadata.branch == "development" and
              .deployment_trigger.metadata.commit_hash == $sha and
              (($beforeIds | index($candidate.id)) == null)
            )] |
            if length == 1 then .[0] else empty end
          ')
          PAGE_URL=$(printf '%s' "$CURRENT_PAGE" | jq -r '.url // empty')
          PAGE_ID=$(printf '%s' "$CURRENT_PAGE" | jq -r '.id // empty')
          PAGE_ALIAS=$(printf '%s' "$CURRENT_PAGE" | jq -r '.aliases[0] // empty')
          test -n "$PAGE_URL" && test -n "$PAGE_ID"
          jq -n \
            --arg deploymentId "$PAGE_ID" \
            --arg deploymentUrl "$PAGE_URL" \
            --arg aliasUrl "$PAGE_ALIAS" \
            --arg previousDeploymentId "$PREVIOUS_PAGE_ID" \
            --arg previousDeploymentUrl "$PREVIOUS_PAGE_URL" \
            --arg commit "$SHA" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{deploymentId:$deploymentId,deploymentUrl:$deploymentUrl,aliasUrl:$aliasUrl,previousDeploymentId:$previousDeploymentId,previousDeploymentUrl:$previousDeploymentUrl,commit:$commit,timestamp:$timestamp,environment:"development"}' \
            > release-pages-metadata.json
          echo "EXACT_PAGES_URL=$PAGE_URL" >> "$GITHUB_ENV"
          echo "PAGES_DEPLOYMENT_ID=$PAGE_ID" >> "$GITHUB_ENV"
          echo "PAGES_ALIAS_URL=$PAGE_ALIAS" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: development-worker-release-metadata
          path: release-worker-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: development-pages-release-metadata
          path: release-pages-metadata.json
      - name: End-to-end development smoke
        run: |
          if ! pnpm release:dev:smoke -- --api-url "$CLOUDFLARE_WORKER_DEV_URL" --web-url "$EXACT_PAGES_URL" --expected-web-origin "$CLOUDFLARE_PAGES_DEV_URL" --expected-commit "$(git rev-parse HEAD)" --email-mode disabled; then
            if [ -n "$PREVIOUS_WORKER_VERSION" ]; then
              pnpm --filter @habitta/api exec wrangler versions deploy "$PREVIOUS_WORKER_VERSION@100%" --env dev --yes
            fi
            exit 1
          fi
          if [ "$CLOUDFLARE_PAGES_DEV_URL" != "$EXACT_PAGES_URL" ]; then
            pnpm release:dev:smoke -- --api-url "$CLOUDFLARE_WORKER_DEV_URL" --web-url "$CLOUDFLARE_PAGES_DEV_URL" --expected-web-origin "$CLOUDFLARE_PAGES_DEV_URL" --expected-commit "$(git rev-parse HEAD)" --email-mode disabled
          fi
