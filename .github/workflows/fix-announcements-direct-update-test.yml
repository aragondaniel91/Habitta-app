name: Fix announcement direct update test

on:
  push:
    branches:
      - feat/backend-announcements-foundation
    paths:
      - scripts/fix-announcements-direct-update-test.py
      - .github/workflows/fix-announcements-direct-update-test.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply test correction
        run: |
          python scripts/fix-announcements-direct-update-test.py
          rm -f scripts/fix-announcements-direct-update-test.py
          rm -f .github/workflows/fix-announcements-direct-update-test.yml
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assert direct announcement updates are denied"
          git push origin HEAD:${{ github.ref_name }}
