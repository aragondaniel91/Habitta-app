name: PR 54 Visual Review

on:
  push:
    branches:
      - agent/expenses-governance-foundation

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm add -Dw playwright@1.54.1 --ignore-workspace-root-check
          pnpm exec playwright install --with-deps chromium
          python -m pip install --quiet pillow

      - name: Create isolated visual review harness
        run: |
          cat > apps/web/visual-review.html <<'HTML'
          <!doctype html>
          <html lang="es">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Habitta visual review</title>
            </head>
            <body><div id="root"></div><script type="module" src="/src/visual-review.tsx"></script></body>
          </html>
          HTML

          cat > apps/web/src/visual-review.tsx <<'TSX'
          import { createRoot } from 'react-dom/client';
          import type { Session } from '@supabase/supabase-js';
          import { AppShell } from './components/AppShell';
          import { APP_ROUTES } from './navigation';
          import { ExpensesPage } from './pages/ExpensesPage';
          import { GovernancePage } from './pages/GovernancePage';
          import './styles.css';
          import './auth.css';
          import './password-auth.css';
          import './admin-onboarding.css';
          import './add-condominium.css';
          import './team-access.css';
          import './admin-invitation.css';
          import './dashboard.css';
          import './dashboard-mobile.css';
          import './community-directory.css';
          import './structure-management.css';
          import './receivables.css';
          import './payments.css';
          import './expenses.css';
          import './reports.css';
          import './settings.css';
          import './community.css';
          import './governance.css';
          import './requests.css';
          import './announcements.css';
          import './brand-palette.css';
          import './brand-assets.css';

          const condoId = 'c0000000-0000-0000-0000-000000000001';
          const now = Date.now();
          const iso = (days: number) => new Date(now + days * 86_400_000).toISOString();
          const session = {
            access_token: 'visual-review-token',
            refresh_token: 'visual-review-refresh',
            expires_in: 3600,
            expires_at: Math.floor(now / 1000) + 3600,
            token_type: 'bearer',
            user: {
              id: 'u0000000-0000-0000-0000-000000000001',
              aud: 'authenticated',
              role: 'authenticated',
              email: 'daniel@aratech.pro',
              email_confirmed_at: iso(-30),
              phone: '',
              confirmed_at: iso(-30),
              last_sign_in_at: iso(0),
              app_metadata: { provider: 'email', providers: ['email'] },
              user_metadata: { full_name: 'Daniel Aragón' },
              identities: [],
              created_at: iso(-90),
              updated_at: iso(0),
              is_anonymous: false,
            },
          } as unknown as Session;

          const categories = [
            { id: 'cat-1', condominium_id: condoId, code: 'MANT', name: 'Mantenimiento', description: null, is_active: true },
            { id: 'cat-2', condominium_id: condoId, code: 'SERV', name: 'Servicios', description: null, is_active: true },
            { id: 'cat-3', condominium_id: condoId, code: 'SEG', name: 'Seguridad', description: null, is_active: true },
            { id: 'cat-4', condominium_id: condoId, code: 'ADM', name: 'Administración', description: null, is_active: true },
          ];
          const vendors = [
            { id: 'ven-1', condominium_id: condoId, name: 'Servicios Hidráulicos Central', tax_identifier: 'J-40123456-7', email: 'servicios@example.com', phone: '+58 212 555 0101', notes: null, is_active: true },
            { id: 'ven-2', condominium_id: condoId, name: 'Seguridad Integral 24', tax_identifier: 'J-40987654-1', email: 'contacto@example.com', phone: '+58 212 555 0188', notes: null, is_active: true },
            { id: 'ven-3', condominium_id: condoId, name: 'Elevadores Metropolitana', tax_identifier: null, email: null, phone: null, notes: null, is_active: true },
          ];
          const baseExpense = {
            condominium_id: condoId,
            due_date: '2026-08-15',
            payment_method: null,
            payment_reference: null,
            support_url: 'https://example.com/soporte.pdf',
            notes: null,
            approved_at: null,
            paid_at: null,
            voided_at: null,
            version: 1,
            created_at: iso(-7),
            updated_at: iso(-1),
          };
          const expenses = [
            { ...baseExpense, id: 'exp-1', category_id: 'cat-1', vendor_id: 'ven-1', description: 'Reparación de bomba de agua principal', invoice_number: 'FAC-2048', expense_date: '2026-08-03', amount: '1850.00', currency_code: 'USD', status: 'pending_approval', notes: 'Incluye reemplazo de sello mecánico y pruebas de presión.' },
            { ...baseExpense, id: 'exp-2', category_id: 'cat-3', vendor_id: 'ven-2', description: 'Servicio mensual de vigilancia', invoice_number: 'SEG-887', expense_date: '2026-08-01', amount: '3200.00', currency_code: 'USD', status: 'paid', payment_method: 'Transferencia', payment_reference: 'TRX-884201', approved_at: iso(-5), paid_at: iso(-3) },
            { ...baseExpense, id: 'exp-3', category_id: 'cat-2', vendor_id: null, description: 'Consumo eléctrico de áreas comunes', invoice_number: 'ELEC-0726', expense_date: '2026-07-28', amount: '48500.00', currency_code: 'VES', status: 'approved', approved_at: iso(-2) },
            { ...baseExpense, id: 'exp-4', category_id: 'cat-1', vendor_id: 'ven-3', description: 'Mantenimiento preventivo de ascensores', invoice_number: 'EM-4412', expense_date: '2026-07-25', amount: '980.00', currency_code: 'USD', status: 'draft' },
            { ...baseExpense, id: 'exp-5', category_id: 'cat-4', vendor_id: null, description: 'Papelería y suministros administrativos', invoice_number: null, expense_date: '2026-07-22', amount: '175.50', currency_code: 'USD', status: 'paid', approved_at: iso(-10), paid_at: iso(-9) },
          ];
          const expenseSummary = {
            totals_by_currency: [
              { currency_code: 'USD', total_amount: 6205.5, draft_amount: 980, pending_amount: 1850, approved_amount: 0, paid_amount: 3375.5, void_amount: 0, expense_count: 4 },
              { currency_code: 'VES', total_amount: 48500, draft_amount: 0, pending_amount: 0, approved_amount: 48500, paid_amount: 0, void_amount: 0, expense_count: 1 },
            ],
            pending_approval_count: 1,
            active_vendor_count: 3,
          };
          const expenseEvents = [
            { id: 'evt-3', expense_id: 'exp-1', event_type: 'submitted', actor_user_id: session.user.id, metadata: {}, occurred_at: iso(-1) },
            { id: 'evt-2', expense_id: 'exp-1', event_type: 'updated', actor_user_id: session.user.id, metadata: {}, occurred_at: iso(-2) },
            { id: 'evt-1', expense_id: 'exp-1', event_type: 'created', actor_user_id: session.user.id, metadata: {}, occurred_at: iso(-3) },
          ];

          const proposals = [
            { id: 'prop-1', condominium_id: condoId, title: 'Renovación de la fachada principal', summary: 'Seleccionar la propuesta para recuperar y modernizar la fachada del conjunto.', description: 'La propuesta contempla reparación de grietas, impermeabilización, pintura y nueva iluminación arquitectónica.', category: 'improvement', status: 'open', voting_basis: 'one_per_unit', quorum_percentage: 50, budget_amount: '18500.00', currency_code: 'USD', opens_at: iso(-2), closes_at: iso(2), version: 2, created_at: iso(-10), updated_at: iso(-2), closed_at: null },
            { id: 'prop-2', condominium_id: condoId, title: 'Presupuesto anual de mantenimiento 2027', summary: 'Aprobación del presupuesto operativo y fondo de reserva para el próximo año.', description: 'Presupuesto anual detallado.', category: 'budget', status: 'draft', voting_basis: 'one_per_owner', quorum_percentage: 60, budget_amount: '92000.00', currency_code: 'USD', opens_at: null, closes_at: iso(12), version: 1, created_at: iso(-4), updated_at: iso(-1), closed_at: null },
            { id: 'prop-3', condominium_id: condoId, title: 'Instalación de cámaras en estacionamientos', summary: 'Ampliación del sistema de videovigilancia en accesos y niveles de estacionamiento.', description: 'Instalar doce cámaras IP y ampliar el almacenamiento.', category: 'security', status: 'approved', voting_basis: 'one_per_unit', quorum_percentage: 50, budget_amount: '7350.00', currency_code: 'USD', opens_at: iso(-18), closes_at: iso(-8), version: 4, created_at: iso(-25), updated_at: iso(-7), closed_at: iso(-8) },
            { id: 'prop-4', condominium_id: condoId, title: 'Decoración comunitaria de Navidad', summary: 'Definir el alcance y presupuesto de la decoración de las áreas comunes.', description: 'Iluminación y decoración del lobby y jardines.', category: 'community', status: 'rejected', voting_basis: 'one_per_owner', quorum_percentage: 50, budget_amount: '2200.00', currency_code: 'USD', opens_at: iso(-40), closes_at: iso(-30), version: 3, created_at: iso(-45), updated_at: iso(-29), closed_at: iso(-30) },
          ];
          const options = [
            { id: 'opt-1', proposal_id: 'prop-1', label: 'Propuesta A · acabado contemporáneo', description: 'Tonos arena, iluminación cálida y jardineras renovadas.', sort_order: 0 },
            { id: 'opt-2', proposal_id: 'prop-1', label: 'Propuesta B · restauración clásica', description: 'Conservar la composición actual y renovar acabados.', sort_order: 1 },
            { id: 'opt-3', proposal_id: 'prop-1', label: 'No ejecutar por ahora', description: 'Posponer la inversión para una próxima asamblea.', sort_order: 2 },
          ];
          const attachments = [
            { id: 'att-1', proposal_id: 'prop-1', document_type: 'quote', file_name: 'Cotización Constructora Horizonte.pdf', url: 'https://example.com/cotizacion-a.pdf' },
            { id: 'att-2', proposal_id: 'prop-1', document_type: 'support', file_name: 'Render y memoria descriptiva.pdf', url: 'https://example.com/render.pdf' },
          ];
          const eligibility = { basis: 'one_per_unit', eligible: true, units: [{ id: 'unit-101', code: 'A-101' }], votes: [] };
          const results = {
            proposal_id: 'prop-1', status: 'open', voting_basis: 'one_per_unit', eligible_count: 48, votes_cast: 31,
            participation_percentage: 64.58, quorum_percentage: 50, quorum_met: true,
            options: [
              { ...options[0], votes: 19, percentage: 61.29 },
              { ...options[1], votes: 9, percentage: 29.03 },
              { ...options[2], votes: 3, percentage: 9.68 },
            ],
          };

          const json = (data: unknown, status = 200) => new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
          window.fetch = async (input) => {
            const path = new URL(typeof input === 'string' ? input : input.url).pathname;
            await new Promise((resolve) => setTimeout(resolve, 20));
            if (path.includes('/notifications/unread-count')) return json({ total: 3, groupedByCondominium: [{ condominiumId: condoId, unreadCount: 3 }] });
            if (path.endsWith('/notifications')) return json([]);
            if (path.endsWith('/expenses/summary')) return json(expenseSummary);
            if (path.endsWith('/expense-categories')) return json(categories);
            if (path.endsWith('/vendors')) return json(vendors);
            if (/\/expenses\/[^/]+\/events$/.test(path)) return json(expenseEvents);
            if (path.endsWith('/expenses')) return json(expenses);
            if (path.endsWith('/options')) return json(options);
            if (path.endsWith('/attachments')) return json(attachments);
            if (path.endsWith('/eligibility')) return json(eligibility);
            if (path.endsWith('/results')) return json(results);
            if (path.endsWith('/governance-proposals')) return json(proposals);
            return json({});
          };

          const view = new URLSearchParams(window.location.search).get('view') === 'governance' ? 'governance' : 'expenses';
          const currentRoute = APP_ROUTES.find((route) => route.key === view)!;
          const organizations = [{ id: 'org-1', name: 'Aragón Gestión Residencial' }];
          const condominiums = [{ id: condoId, name: 'Residencias Parque Central', organization_id: 'org-1' }];

          createRoot(document.getElementById('root')!).render(
            <AppShell
              condominiums={condominiums}
              contextMessage={null}
              currentRoute={currentRoute}
              notificationOpen={false}
              onAddCondominium={() => undefined}
              onCloseNotifications={() => undefined}
              onCondominiumChange={() => undefined}
              onNavigate={() => undefined}
              onOpenNotifications={() => undefined}
              onSignOut={() => undefined}
              organizations={organizations}
              selectedCondominiumId={condoId}
              session={session}
            >
              {view === 'governance' ? (
                <GovernancePage condominiumId={condoId} condominiumName="Residencias Parque Central" session={session} />
              ) : (
                <ExpensesPage condominiumId={condoId} condominiumName="Residencias Parque Central" session={session} />
              )}
            </AppShell>,
          );
          TSX

      - name: Start local web app
        run: |
          pnpm --filter @habitta/web exec vite --host 127.0.0.1 --port 4173 > /tmp/habitta-vite.log 2>&1 &
          echo $! > /tmp/habitta-vite.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/visual-review.html?view=expenses >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/habitta-vite.log
          exit 1

      - name: Capture desktop and mobile screens
        run: |
          mkdir -p visual-review
          cat > /tmp/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const base = 'http://127.0.0.1:4173/visual-review.html';

          async function capture(view, viewport, output, detail = false) {
            const page = await browser.newPage({ viewportSize: viewport, deviceScaleFactor: 1 });
            await page.goto(`${base}?view=${view}`, { waitUntil: 'networkidle' });
            if (view === 'expenses') await page.locator('.expenses-table tbody tr').first().waitFor();
            else await page.locator('.governance-card').first().waitFor();
            if (detail) {
              if (view === 'expenses') await page.locator('.expenses-table tbody tr').first().click();
              else await page.locator('.governance-card').first().click();
              await page.locator(view === 'expenses' ? '.expenses-drawer' : '.governance-drawer').waitFor();
              await page.waitForTimeout(150);
            }
            await page.screenshot({ path: `visual-review/${output}`, fullPage: true });
            await page.close();
          }

          await capture('expenses', { width: 1440, height: 1000 }, '01-expenses-desktop.png');
          await capture('expenses', { width: 390, height: 844 }, '02-expenses-mobile.png');
          await capture('expenses', { width: 1440, height: 1000 }, '03-expenses-detail-desktop.png', true);
          await capture('governance', { width: 1440, height: 1000 }, '04-governance-desktop.png');
          await capture('governance', { width: 390, height: 844 }, '05-governance-mobile.png');
          await capture('governance', { width: 1440, height: 1000 }, '06-governance-detail-desktop.png', true);
          await browser.close();
          JS
          node /tmp/capture.mjs

      - name: Build contact sheet and archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path('visual-review')
          files = sorted(root.glob('*.png'))
          labels = {
              '01-expenses-desktop.png': 'Gastos · escritorio',
              '02-expenses-mobile.png': 'Gastos · móvil',
              '03-expenses-detail-desktop.png': 'Detalle de gasto · escritorio',
              '04-governance-desktop.png': 'Propuestas y votaciones · escritorio',
              '05-governance-mobile.png': 'Propuestas y votaciones · móvil',
              '06-governance-detail-desktop.png': 'Detalle de propuesta · escritorio',
          }
          cell_w, cell_h, margin, label_h = 620, 460, 24, 42
          sheet = Image.new('RGB', (cell_w * 2 + margin * 3, cell_h * 3 + margin * 4), 'white')
          draw = ImageDraw.Draw(sheet)
          font = ImageFont.load_default(size=18)
          for index, path in enumerate(files):
              image = Image.open(path).convert('RGB')
              image.thumbnail((cell_w - 24, cell_h - label_h - 24))
              col, row = index % 2, index // 2
              x = margin + col * (cell_w + margin)
              y = margin + row * (cell_h + margin)
              draw.rounded_rectangle((x, y, x + cell_w, y + cell_h), radius=16, fill='#f5f7fb', outline='#dce3ec', width=2)
              draw.text((x + 16, y + 12), labels[path.name], fill='#17243a', font=font)
              ix = x + (cell_w - image.width) // 2
              iy = y + label_h + (cell_h - label_h - image.height) // 2
              sheet.paste(image, (ix, iy))
          sheet.save(root / 'Habitta-PR54-contact-sheet.jpg', quality=91)
          PY
          cd visual-review
          zip -9 Habitta-PR54-responsive-review.zip 0*.png Habitta-PR54-contact-sheet.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: habitta-pr54-visual-review
          path: |
            visual-review/*.png
            visual-review/*.jpg
            visual-review/*.zip
          retention-days: 7
