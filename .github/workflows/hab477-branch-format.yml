name: HAB-477 Branch Formatter

on:
  push:
    branches:
      - hab-477-commercial-actions-audit-history

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip hab477-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hab-477-commercial-actions-audit-history
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            apps/platform-admin/commercial.html \
            apps/platform-admin/commercial.js
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/platform-admin/commercial.html apps/platform-admin/commercial.js
          git commit -m 'HAB-477 apply Prettier output [skip hab477-format]'
          git push origin HEAD:hab-477-commercial-actions-audit-history
