name: Apply Guided Import Routes

on:
  push:
    branches:
      - feat/help-guided-csv-import

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/help-guided-csv-import
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Connect import routes
        run: python scripts/patch-guided-import-routes.py
      - name: Validate implementation
        run: |
          pnpm install --frozen-lockfile
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/index.ts apps/api/src/import-routes.ts apps/web/src supabase/migrations/20260805060000_guided_structure_import.sql
          git commit -m "Add contextual help and guided CSV imports"
          git push origin HEAD:feat/help-guided-csv-import
