name: Temporary HAB-184 integration patch

on:
  push:
    branches:
      - agent/hab-184-people-relationships
    paths:
      - '.github/workflows/tmp-hab184-integrate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch API integration and pgTAP plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('apps/api/src/index.ts')
          text = index.read_text()

          replacements = [
            (
              "import { treasuryRoutes } from './treasury-routes';\n",
              "import { treasuryRoutes } from './treasury-routes';\nimport { peopleRelationshipRoutes } from './people-relationships-routes';\n",
            ),
            (
              "app.route('/v1/condominiums', treasuryRoutes);\n",
              "app.route('/v1/condominiums', treasuryRoutes);\napp.route('/v1/condominiums', peopleRelationshipRoutes);\n",
            ),
            (
              "      email: p.email ?? null,\n      phone: p.phone ?? null,\n      status: p.status,\n      created_by: c.get('userId'),\n",
              "      email: p.email ?? null,\n      phone: p.phone ?? null,\n      document_type: p.documentType === '' ? null : (p.documentType ?? null),\n      document_number: p.documentNumber === '' ? null : (p.documentNumber ?? null),\n      status: p.status,\n      created_by: c.get('userId'),\n",
            ),
            (
              "        email: p.email,\n        phone: p.phone,\n        status: p.status,\n",
              "        email: p.email,\n        phone: p.phone,\n        document_type: p.documentType === '' ? null : p.documentType,\n        document_number: p.documentNumber === '' ? null : p.documentNumber,\n        status: p.status,\n",
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one API replacement, found {count}: {old[:80]!r}')
            text = text.replace(old, new, 1)
          index.write_text(text)

          test = Path('supabase/tests/hab184_people_relationships.sql')
          sql = test.read_text()
          if sql.count('select plan(22);') != 1:
            raise SystemExit('expected exactly one HAB-184 plan(22)')
          test.write_text(sql.replace('select plan(22);', 'select plan(23);', 1))
          PY
      - name: Format TypeScript
        run: pnpm exec prettier --write apps/api/src/index.ts apps/api/src/people-relationships-routes.ts apps/api/test/people-relationships-route.test.ts
      - name: Commit product changes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-hab184-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/index.ts apps/api/src/people-relationships-routes.ts apps/api/test/people-relationships-route.test.ts supabase/tests/hab184_people_relationships.sql .github/workflows/tmp-hab184-integrate.yml
          git commit -m 'feat: integrate HAB-184 person-centric relationships'
          git push origin HEAD:agent/hab-184-people-relationships
