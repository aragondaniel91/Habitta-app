name: Fix PR 54 CI

on:
  push:
    branches:
      - agent/expenses-governance-foundation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Fix PR 54 database tests')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expenses-governance-foundation
          fetch-depth: 0

      - name: Apply targeted database test fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260805010000_expenses_governance.sql')
          text = migration.read_text()
          replacements = {
              '  person_id uuid;': '  voter_person_id uuid;',
              '  into person_id\n  from public.people p': '  into voter_person_id\n  from public.people p',
              '  if person_id is null then': '  if voter_person_id is null then',
              '      where uo.person_id = person_id': '      where uo.person_id = voter_person_id',
          }
          for old, new in replacements.items():
              count = text.count(old)
              expected = 2 if old == '      where uo.person_id = person_id' else 1
              if count != expected:
                  raise SystemExit(f'Unexpected occurrence count for {old!r}: {count}, expected {expected}')
              text = text.replace(old, new)
          migration.write_text(text)

          notifications = Path('supabase/tests/notifications.sql')
          text = notifications.read_text()
          anchor = "insert into public.condominiums(id,organization_id,name,created_by) values ('a2000000-0000-0000-0000-000000000001','a1000000-0000-0000-0000-000000000001','Condo A','a0000000-0000-0000-0000-000000000001'),('b2000000-0000-0000-0000-000000000001','b1000000-0000-0000-0000-000000000001','Condo B','a0000000-0000-0000-0000-000000000011');\n"
          addition = anchor + "update public.condominium_notification_settings set timezone='UTC' where condominium_id in ('a2000000-0000-0000-0000-000000000001','b2000000-0000-0000-0000-000000000001');\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'Unexpected condominium setup anchor count: {text.count(anchor)}')
          if "set timezone='UTC' where condominium_id in" not in text:
              text = text.replace(anchor, addition)
          notifications.write_text(text)
          PY

      - name: Commit targeted fixes
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260805010000_expenses_governance.sql supabase/tests/notifications.sql
          git commit -m "Fix PR 54 database tests"
          git push origin HEAD:agent/expenses-governance-foundation
