name: Format Help Imports

on:
  push:
    branches:
      - feat/help-guided-csv-import

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/help-guided-csv-import
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format guided import files
        run: |
          pnpm exec prettier --write \
            apps/web/src/features/imports/csv.ts \
            apps/web/src/features/imports/CsvImportWizard.tsx
          pnpm exec prettier --check \
            apps/web/src/features/imports/csv.ts \
            apps/web/src/features/imports/CsvImportWizard.tsx
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/features/imports/csv.ts apps/web/src/features/imports/CsvImportWizard.tsx
          git commit -m "Format guided import UI"
          git push origin HEAD:feat/help-guided-csv-import
