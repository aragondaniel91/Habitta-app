name: Apply Private Operational Documents Retry

on:
  push:
    branches:
      - feat/private-operational-documents

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/private-operational-documents
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Reuse reviewed source patch
        run: |
          awk '
            /cat > \/tmp\/private-documents.patch.gz.b64/ { capture = 1; next }
            capture && /^[[:space:]]*PATCH$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-private-documents.yml > /tmp/private-documents.patch.gz.b64
          base64 --decode /tmp/private-documents.patch.gz.b64 | gzip --decompress > /tmp/private-documents.patch
          git apply --index /tmp/private-documents.patch

      - name: Format TypeScript and CSS
        run: |
          pnpm exec prettier --write \
            apps/api/src/index.ts \
            apps/api/src/private-document-routes.ts \
            apps/api/src/private-document-routes.test.ts \
            apps/web/src/features/documents/api.ts \
            apps/web/src/features/documents/api.test.ts \
            apps/web/src/features/documents/PrivateDocumentUploader.tsx \
            apps/web/src/lib/expenses.ts \
            apps/web/src/lib/governance.ts \
            apps/web/src/main.tsx \
            apps/web/src/pages/AnnouncementsPage.tsx \
            apps/web/src/pages/ExpensesPage.tsx \
            apps/web/src/pages/GovernancePage.tsx \
            apps/web/src/pages/RequestsPage.tsx \
            apps/web/src/private-documents.css

      - name: Commit feature without temporary workflows
        run: |
          git rm \
            .github/workflows/apply-private-documents.yml \
            .github/workflows/apply-private-documents-retry.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add private operational documents"
          git push origin HEAD:feat/private-operational-documents
