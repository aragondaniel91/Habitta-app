name: HAB-475 Branch Formatter

on:
  push:
    branches:
      - hab-475-subscription-revenue-trial-ops

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'HAB-475: apply Prettier formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hab-475-subscription-revenue-trial-ops

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format HAB-475 files only
        run: |
          pnpm exec prettier --write \
            apps/platform-admin/customers.html \
            apps/platform-admin/subscriptions.html \
            apps/platform-admin/subscriptions.js \
            apps/web/src/hab475-platform-subscription-revenue-trials.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/platform-admin/customers.html \
            apps/platform-admin/subscriptions.html \
            apps/platform-admin/subscriptions.js \
            apps/web/src/hab475-platform-subscription-revenue-trials.test.ts
          git commit -m 'HAB-475: apply Prettier formatting'
          git push origin HEAD:hab-475-subscription-revenue-trial-ops
