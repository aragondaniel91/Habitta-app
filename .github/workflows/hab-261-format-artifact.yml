name: HAB-261 Apply Formatter

on:
  push:
    branches:
      - hab-261-people-ux-redesign

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hab-261-people-ux-redesign
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format HAB-261 files
        run: >-
          pnpm exec prettier --write
          apps/web/src/features/people/PeopleImportDrawerV3.tsx
          apps/web/src/features/people/PeoplePanelV3.tsx
          apps/web/src/features/people/PersonEditorDrawerV3.tsx
          apps/web/src/features/people/PersonRelationshipHistoryDrawerV3.tsx
          apps/web/src/features/people/PersonUnitRelationshipDrawerV3.tsx
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/people/*.tsx
          git commit -m "chore(HAB-261): apply exact Prettier output"
          git push origin HEAD:hab-261-people-ux-redesign
