name: HAB-261 Format Artifact

on:
  push:
    branches:
      - hab-261-people-ux-redesign

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format HAB-261 files
        run: >-
          pnpm exec prettier --write
          apps/web/src/features/people/PeopleImportDrawerV3.tsx
          apps/web/src/features/people/PeoplePanelV3.tsx
          apps/web/src/features/people/PersonEditorDrawerV3.tsx
          apps/web/src/features/people/PersonRelationshipHistoryDrawerV3.tsx
          apps/web/src/features/people/PersonUnitRelationshipDrawerV3.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: hab-261-formatted-files
          path: |
            apps/web/src/features/people/PeopleImportDrawerV3.tsx
            apps/web/src/features/people/PeoplePanelV3.tsx
            apps/web/src/features/people/PersonEditorDrawerV3.tsx
            apps/web/src/features/people/PersonRelationshipHistoryDrawerV3.tsx
            apps/web/src/features/people/PersonUnitRelationshipDrawerV3.tsx
          if-no-files-found: error
