name: Fix Recovered Visual Selector

on:
  push:
    branches:
      - feat/password-auth-admin-onboarding
    paths:
      - '.github/workflows/fix-recovered-visual-selector.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/password-auth-admin-onboarding

      - name: Fix strict city selector
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/recover-visual-screenshots.yml')
          text = path.read_text()
          old = "await page.getByLabel('Ciudad').fill('Caracas');"
          new = "await page.getByRole('textbox', { name: 'Ciudad', exact: true }).fill('Caracas');"
          if old not in text:
              raise SystemExit('Expected city selector was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/recover-visual-screenshots.yml
          git commit -m "chore: fix responsive screenshot city selector"
          git push origin HEAD:feat/password-auth-admin-onboarding
