name: HAB-262 Exact Formatter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hab-262-units-ux-redesign
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format HAB-262 files
        run: >-
          pnpm exec prettier --write
          apps/web/src/features/units/UnitDetailDrawer.tsx
          apps/web/src/pages/UnitsPage.tsx
          apps/web/src/units-v3.css
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/units/UnitDetailDrawer.tsx apps/web/src/pages/UnitsPage.tsx apps/web/src/units-v3.css
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git commit -m "chore(HAB-262): apply exact Prettier output"
          git push origin HEAD:hab-262-units-ux-redesign
