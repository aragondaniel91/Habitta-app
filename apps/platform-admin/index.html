<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Habitta Platform Admin</title>
    <style>
      :root {
        --navy: #0d1b2a;
        --blue: #1b4f72;
        --green: #28a745;
        --red: #b3261e;
        --background: #f5f7fa;
        --text: #333d4b;
        --muted: rgb(51 61 75 / 0.72);
        --border: rgb(51 61 75 / 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        background: var(--background);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      main {
        width: min(920px, 100%);
        margin: 0 auto;
        padding: clamp(24px, 5vw, 44px);
        border: 1px solid var(--border);
        border-radius: 24px;
        background: white;
        box-shadow: 0 28px 90px rgb(13 27 42 / 0.08);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 0 11px;
        border-radius: 999px;
        background: rgb(40 167 69 / 0.1);
        color: var(--green);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 6px;
        color: var(--navy);
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        letter-spacing: -0.045em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.65;
      }

      form {
        display: grid;
        gap: 14px;
        max-width: 360px;
        margin-top: 26px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--navy);
      }

      input {
        min-height: 42px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 12px;
        font: inherit;
      }

      button {
        min-height: 42px;
        border: 0;
        border-radius: 10px;
        background: var(--blue);
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
      }

      #login-error {
        min-height: 1.1em;
        color: var(--red);
        font-size: 0.82rem;
        font-weight: 600;
      }

      #dashboard-view header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 22px;
      }

      table {
        width: 100%;
        margin-top: 18px;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        text-align: left;
      }

      th {
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      #overview-status {
        margin-top: 14px;
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Internal • Platform Admin</span>
      <h1>Habitta Platform Admin</h1>
      <p>
        Backoffice separado para operar la plataforma Habitta, fuera del portal de condominios.
        Vista de solo lectura: aún no permite modificar organizaciones ni condominios.
      </p>

      <section id="login-view">
        <form id="login-form">
          <label>
            Correo
            <input autocomplete="email" name="email" required type="email" />
          </label>
          <label>
            Contraseña
            <input autocomplete="current-password" name="password" required type="password" />
          </label>
          <button type="submit">Iniciar sesión</button>
          <p id="login-error" role="alert"></p>
        </form>
      </section>

      <section hidden id="dashboard-view">
        <header>
          <strong>Organizaciones y condominios</strong>
          <button class="secondary" id="logout-button" type="button">Cerrar sesión</button>
        </header>
        <p id="overview-status"></p>
        <table>
          <thead>
            <tr>
              <th>Organización</th>
              <th>Condominio</th>
              <th>Unidades</th>
              <th>Miembros</th>
              <th>Creado</th>
            </tr>
          </thead>
          <tbody id="overview-body"></tbody>
        </table>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
